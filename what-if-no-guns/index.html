<!doctype html>
<html><head><meta charset="utf-8"><title>What If All Guns Vanished</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script src="build/timeline.js"></script>
<script>
const cv = document.getElementById('c');
ctx = cv.getContext('2d');
const SCALE = cv.width / VW;
function drawCaption(T, sc) {
  const t = T - sc.start;
  sc.lines.forEach((l, li) => {
    const nx = li + 1 < sc.lines.length ? sc.lines[li + 1].start - .12 : 1e9; const e = Math.min(l.end + .35, nx);
    if (t < l.start - .1 || t > e) return;
    const a = Math.min(prog(t, l.start - .1, .12), 1 - prog(t, e - .12, .12));
    ctx.save(); ctx.globalAlpha = a; ctx.font = `700 26px ${FONT}`;
    // wrap
    const words = l.text.split(' '), rows = []; let cur = '';
    for (const w of words) { const s = cur ? cur + ' ' + w : w; if (ctx.measureText(s).width > 980 && cur) { rows.push(cur); cur = w; } else cur = s; }
    rows.push(cur);
    const lh = 36, h = rows.length * lh + 18, wmax = Math.max(...rows.map(r => ctx.measureText(r).width)) + 40;
    const y0 = VH - 30 - h;
    fillRR(640 - wmax / 2, y0, wmax, h, 12, 'rgba(0,0,0,.62)');
    rows.forEach((r, i) => text(r, 640, y0 + 9 + lh / 2 + i * lh, 26, '#fff', { weight: 700 }));
    ctx.restore();
  });
}
window.renderFrame = function (T) {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalAlpha = 1;
  rect(0, 0, VW, VH, '#000');
  const scs = TIMELINE.scenes;
  let sc = scs[0]; for (const s of scs) if (T >= s.start) sc = s;
  const t = T - sc.start;
  ctx.save(); SCENES[sc.id](t, sc); ctx.restore();
  ctx.globalAlpha = 1;
  const fin = 1 - prog(t, 0, .3), fout = prog(t, sc.dur - .25, .25);
  if (sc !== scs[0]) flash(fin, '#000');
  if (sc !== scs[scs.length - 1]) flash(fout, '#000');
  drawCaption(T, sc);
  // watermark
  text('WHAT IF?', 1220, 30, 16, 'rgba(255,255,255,.55)', { weight: 900 });
};
window.grab = (T, q) => { renderFrame(T); return cv.toDataURL('image/jpeg', q || .92); };
// preview mode: play in real time
if (!navigator.webdriver) { const t0 = performance.now(); (function loop() { renderFrame(((performance.now() - t0) / 1000) % TIMELINE.total); requestAnimationFrame(loop); })(); }
</script>
</body></html>
