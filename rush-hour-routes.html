<title>Rush Hour Routes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen map canvas, glass HUD on top, big thumb-friendly toolbar at the bottom. */
:root{
  --grass:#93c96f; --deep:#1d3b2f; --ink:#1b2733; --muted:#5d6b78; --panel:rgba(255,255,255,.95); --line:#d7e0e6;
  --accent:#2a7de1; --accent-soft:#e4effd; --ok:#3fb868; --warn:#f2b632; --bad:#e2483d; --night:#2b3a67;
  --font-display:'Outfit','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#6fae55;color:var(--ink);font-family:var(--font-body);font-size:14px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.pick{cursor:crosshair}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(18,45,30,.22)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(8,16,24,.32) 100%)}
#top{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
#row1{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;pointer-events:none}
#row1>*{pointer-events:auto}
#satCard{flex:1 1 230px;padding:8px 14px;min-width:0}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.satline{display:flex;align-items:center;gap:12px}
#satPct{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1.05;min-width:76px;font-variant-numeric:tabular-nums}
#satBar{position:relative;flex:1;height:12px;border-radius:8px;background:#e6edf1;overflow:hidden}
#satFill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:8px;background:var(--ok);transition:width .4s,background .4s}
#satMark{position:absolute;left:50%;top:-2px;bottom:-2px;width:3px;background:var(--ink);opacity:.55}
.counts{font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap}
.counts i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#satCard.warn #satPct{color:var(--bad);animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.55}}
#clockCard{flex:1 1 200px;padding:8px 14px;min-width:0}
.clockline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#clock{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
#dayLbl{font-weight:800;font-size:13px;color:var(--muted)}
#phasePill{font-weight:800;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
#phasePill.rush{background:var(--accent);color:#fff}
#tl{position:relative;display:flex;height:8px;border-radius:6px;overflow:hidden;margin-top:6px;background:#e6edf1}
#tl i{display:block;height:100%}
#tlMark{position:absolute;top:-2px;bottom:-2px;width:4px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
#ctrl{display:flex;gap:6px;padding:6px;align-items:center}
.cbtn{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:16px;padding:0}
.cbtn:active{transform:scale(.95)}
.cbtn:disabled{opacity:.35}
.cbtn svg{width:24px;height:24px}
#bPlay{background:var(--ok);color:#fff;border-color:transparent;width:60px}
#bPlay.paused.ready{animation:ready 1s infinite alternate}
@keyframes ready{to{box-shadow:0 0 0 8px rgba(63,184,104,.28)}}
#banner{padding:8px 14px;font-weight:700;display:flex;gap:10px;align-items:center;border-left:6px solid var(--warn)}
#banner.concert{border-left-color:#8a5cf6}
#banner b{font-family:var(--font-display)}
#banner span.t{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
#hint{align-self:center;max-width:100%;padding:7px 14px;border-radius:99px;background:rgba(27,39,51,.82);color:#fff;font-weight:700;font-size:13px;text-align:center;pointer-events:none}
.toast{align-self:center;padding:8px 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;pointer-events:none;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#bottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#bottom>*{pointer-events:auto;max-width:100%}
#toolbar{display:flex;gap:6px;padding:6px}
.tbtn{position:relative;width:78px;height:62px;border-radius:14px;border:2px solid transparent;background:#f1f5f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:12px;padding:0}
.tbtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tbtn.on{background:var(--accent);color:#fff}
.tbtn:active{transform:scale(.96)}
.tbtn .badge{position:absolute;top:-6px;right:-4px;background:var(--ink);color:#fff;border-radius:99px;font-size:11px;padding:2px 7px;font-variant-numeric:tabular-nums}
#sheet{width:min(600px,100%);max-height:38vh;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.rrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;border-radius:12px;border:2px solid var(--line);background:#fff}
.rrow.sel{border-color:var(--accent);background:var(--accent-soft)}
.rrow:not(.sel) .mini{display:none}
.sw{width:14px;height:34px;border-radius:7px;flex:none}
.rinfo{flex:1 1 120px;min-width:0;display:flex;flex-direction:column}
.rinfo b{font-family:var(--font-display);font-size:15px}
.rinfo b em{font-style:normal;font-size:11px;background:#fff3c9;color:#8a6200;border-radius:6px;padding:1px 6px;margin-left:4px}
.rinfo small{color:var(--muted);font-weight:600}
.rinfo small.bad{color:var(--bad);font-weight:800}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:#f1f5f8;font-size:24px;font-weight:800;line-height:1;padding:0}
.stepper .bn{min-width:26px;text-align:center;font-family:var(--font-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.mini{height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#f1f5f8;font-weight:800;font-size:13px}
.mini.on{background:#ffe9a8;border-color:#e6b93a}
.mini.danger{color:var(--bad)}
.mini.locked{opacity:.55}
.mini:disabled{opacity:.45}
.empty{padding:10px;color:var(--muted);font-weight:600;text-align:center}
#coach{display:flex;gap:10px;align-items:center;padding:10px 12px;width:min(560px,100%);box-sizing:border-box;border:2px solid #8a5cf6;font-weight:700;font-size:13px;line-height:1.35}
#coach span{flex:1}
#coach button{height:44px;padding:0 16px;border-radius:12px;border:0;background:#8a5cf6;color:#fff;font-weight:800}
#drawbar{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border:2px solid var(--accent)}
#drawbar .txt{font-weight:800;margin-right:4px}
#drawbar button{height:50px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#f1f5f8;font-weight:800;font-size:14px}
#drawbar button.go{background:var(--ok);color:#fff;border-color:transparent}
#stopcard{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;width:min(520px,100%);box-sizing:border-box}
#stopcard .si{flex:1 1 200px;display:flex;flex-direction:column}
#stopcard .si b{font-family:var(--font-display);font-size:15px}
#stopcard .si span{color:var(--muted);font-weight:600;font-size:13px}
#stopcard button{height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#f1f5f8;font-weight:800}
#stopcard button.danger{color:var(--bad)}
#ov{position:absolute;inset:0;background:rgba(18,40,32,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;z-index:10}
.card{width:min(760px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-sizing:border-box;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card.small{width:min(440px,100%);text-align:center}
.card h1{font-family:var(--font-display);font-weight:800;font-size:34px;margin:0;line-height:1.05;text-wrap:balance}
.card h2{font-family:var(--font-display);font-weight:800;font-size:26px;margin:0 0 6px;text-wrap:balance}
.card p{margin:6px 0;line-height:1.45;color:#34424f}
.sub{color:var(--muted);font-weight:600;margin-top:6px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:16px 0}
.how div{background:#f2f7f4;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4}
.how b{display:block;font-family:var(--font-display);font-size:15px;margin-bottom:2px}
.how .dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lv{border:2px solid var(--line);border-radius:16px;background:#fff;padding:14px;text-align:left;min-height:120px;display:flex;flex-direction:column;gap:4px}
.lv:hover,.lv:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
.lv b{font-family:var(--font-display);font-size:18px}
.lv small{color:var(--muted);font-weight:600;line-height:1.35}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.chip{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:#e6edf1}
.chip.new{background:#ffe9a8;color:#7a5600}
.stars{font-size:20px;letter-spacing:2px;color:#d3a21d}
.stars .off{color:#d6dde2}
.card>.btnrow:last-child{position:sticky;bottom:-22px;background:linear-gradient(rgba(255,255,255,0),#fff 28%);padding:14px 0 4px;margin-top:10px}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{height:54px;padding:0 24px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-family:var(--font-display);font-weight:800;font-size:17px}
.btn.alt{background:#e9eff3;color:var(--ink)}
.btn.ok{background:var(--ok)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.statgrid div{background:#f2f7f4;border-radius:12px;padding:10px}
.statgrid b{display:block;font-family:var(--font-display);font-size:26px;font-variant-numeric:tabular-nums}
.statgrid span{font-size:12px;font-weight:700;color:var(--muted)}
#photoX{position:absolute;right:14px;bottom:14px;z-index:5;height:48px;padding:0 18px;border-radius:14px;border:0;background:rgba(20,30,40,.7);color:#fff;font-weight:800}
.photo #top,.photo #bottom,.photo #vig{display:none}
.cash{margin-left:auto;font-family:var(--font-display);font-weight:800;color:var(--ink);font-size:14px}
.cash.neg{color:var(--bad)}
.shead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:2px 4px}
.shead b{font-family:var(--font-display);font-size:15px;margin-right:auto}
.rtools{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:6px}
.rtools .rname{flex:1 1 140px;height:44px;border-radius:12px;border:1px solid var(--line);padding:0 12px;font:700 14px var(--font-body);min-width:0;user-select:text;-webkit-user-select:text}
.mini.on{background:#d9f3e2;border-color:#7fcf9c}
.sw{border:0;padding:0;cursor:pointer;width:18px}
.badges em{font-style:normal;font-size:10px;background:#e6edf1;color:#4b5a68;border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:800}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:4px 8px}
.tbl td{text-align:right;padding:6px 8px;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.neg{color:var(--bad)}
.worst{background:#fff4d6;border-radius:12px;padding:10px 14px;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;line-height:1.35}
.worst b{width:100%;font-family:var(--font-display)}
.goals{list-style:none;padding:0;margin:12px 0;display:flex;flex-direction:column;gap:6px}
.goals li{display:flex;align-items:center;gap:10px;background:#f2f7f4;border-radius:12px;padding:10px 14px;font-weight:700}
.goals li span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--muted);font-size:13px}
.goals li.ok span{background:var(--ok)}.goals li.no span{background:var(--bad)}
.goals li em{margin-left:auto;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
#missions{padding:7px 12px;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;gap:3px}
#missions .m{display:flex;gap:8px;align-items:center}
#missions .m b{font-weight:800;color:var(--accent)}
#missions .m.done{color:var(--ok);text-decoration:line-through;opacity:.8}
#missions .m.fail{color:var(--muted);text-decoration:line-through;opacity:.7}
#missions .m em{margin-left:auto;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
#missions .rv{color:#c26a12}
.lvlrow{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;font-weight:800;color:var(--muted)}
#xpBar{flex:1;height:5px;border-radius:4px;background:#e6edf1;overflow:hidden}
#xpFill{display:block;height:100%;background:#8a5cf6;width:0}
.hallgrid{display:grid;gap:8px;margin:12px 0}
.hallrow{display:flex;gap:10px;align-items:center;background:#f2f7f4;border-radius:12px;padding:10px 12px}
.hallrow div{flex:1;min-width:0}.hallrow b{font-family:var(--font-display)}.hallrow small{display:block;color:var(--muted);font-weight:600;line-height:1.3}
.hallrow.owned{background:#e1f5e8}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sw2{min-width:52px;height:52px;border-radius:12px;border:3px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;padding:0 8px;background:#fff}
.sw2.on{border-color:var(--accent)}.sw2:disabled{opacity:.45}
.sharecard{width:100%;border-radius:14px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.25);-webkit-user-select:auto;user-select:auto}
.menugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.menugrid .btn{height:50px;font-size:15px;padding:0 10px}
.menugrid .full{grid-column:1/-1}
@media (max-width:560px){
  .tbtn{width:60px!important;font-size:11px}
  #bSound,#bFit{display:none}
  #satCard{flex:1 1 150px;padding:6px 12px}
  #clockCard{flex:1 1 120px;padding:6px 10px;order:2}
  #clock{font-size:21px}#dayLbl{font-size:11px}
  .set{flex-wrap:wrap}.set .seg{justify-content:flex-start;width:100%}
  #ctrl{order:1}
  .satline{gap:8px}
  #top,#bottom{left:8px;right:8px}
  #top{top:8px}#bottom{bottom:8px}
  #satPct{font-size:28px;min-width:64px}
  #clock{font-size:24px}
  .cbtn{width:46px;height:46px}#bPlay{width:54px}
  .tbtn{width:70px;height:60px}
  .card{padding:16px}.card h1{font-size:28px}
  .how{grid-template-columns:repeat(2,1fr);gap:8px}.how div{font-size:12.5px;padding:10px}.how b{font-size:14px}
  #sheet{max-height:34vh}
  #ctrl{padding:5px;gap:4px}
}

.set{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);text-align:left}
.set b{font-family:var(--font-display);font-size:15px}.set small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-weight:800;font-size:13px;min-height:38px}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tro{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
.tro i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e6edf1;color:var(--muted);font-weight:800;flex:none}
.tro.got i{background:var(--ok);color:#fff}.tro.lock{opacity:.6}
.tro b{font-family:var(--font-display)}.tro small{display:block;color:var(--muted);font-weight:600}
.slotc{border:2px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;text-align:left}
.slotc.cur{border-color:var(--ok)}
.quote{font-style:italic;color:var(--ink);line-height:1.5;margin:10px 0}
body.big #top,body.big #bottom,body.big #ov .card{zoom:1.18}
body.rm *{animation:none!important;transition:none!important}
@media (max-width:560px){#missions:not(.open) .m:nth-child(n+2){display:none}#missions{cursor:pointer}#missions:not(.open)::after{content:"Tap for all missions";font-size:11px;color:var(--muted);font-weight:700}body.big #top,body.big #bottom,body.big #ov .card{zoom:1.1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <canvas id="cv" aria-label="City map"></canvas>

  <div id="vig"></div>
  <div id="top">
    <div id="row1">
      <div class="panel" id="satCard">
        <div class="lbl" title="Share of the last 50 riders who reached their destination">Satisfaction · last 50 riders</div>
        <div class="satline"><span id="satPct">100%</span><div id="satBar"><i id="satFill"></i><b id="satMark"></b></div></div>
        <div class="counts"><span><i style="background:var(--ok)"></i><span id="cDel">0</span> delivered</span><span><i style="background:var(--bad)"></i><span id="cGave">0</span> gave up</span><span class="cash" id="cCash">$0</span></div>
        <div class="lvlrow"><span id="cLvl">Lv 1</span><div id="xpBar"><i id="xpFill"></i></div></div>
      </div>
      <div class="panel" id="clockCard">
        <div class="clockline"><span id="clock">06:00</span><span id="dayLbl">Day 1/3</span><span id="phasePill">Quiet morning</span></div>
        <div id="tl"><span id="tlMark"></span></div>
      </div>
      <div class="panel" id="ctrl">
        <button class="cbtn paused ready" id="bPlay" data-act="play" aria-label="Play or pause"></button>
        <button class="cbtn" id="bSpeed" data-act="speed" aria-label="Speed">1×</button>
        <button class="cbtn" id="bSound" data-act="sound" aria-label="Sound"></button>
        <button class="cbtn" id="bUndo" data-act="undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12"/></svg></button>
        <button class="cbtn" id="bFit" data-act="fit" aria-label="Fit map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="cbtn" id="bMenu" data-act="menu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </div>
    <div class="panel" id="banner" hidden></div>
    <div class="panel" id="missions" hidden></div>
    <div id="hint" hidden></div>
    <div id="toasts" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>

  <div id="bottom">
    <div class="panel" id="coach" hidden></div>
    <div class="panel" id="stopcard" hidden></div>
    <div class="panel" id="drawbar" hidden></div>
    <div class="panel" id="sheet" hidden></div>

function weekKey(){const d=new Date(),t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const fy=t.getUTCFullYear(),j4=new Date(Date.UTC(fy,0,4));return fy*100+1+Math.round(((t-j4)/864e5-3+((j4.getUTCDay()+6)%7))/7)}
function dayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function challengeKey(weekly){return weekly?weekKey():dayKey()}
function dailyLevel(tries,weekly){
  const key=challengeKey(weekly),R=rng(key*7+tries+(weekly?99:0)),cols=weekly?12:10,rows=weekly?8:7;
  const m=[];for(let r=0;r<rows;r++){m.push([]);for(let c=0;c<cols;c++)m[r].push('.')}
  const bw=3,bh=2+Math.floor(R()*2),bc=2+Math.floor(R()*(cols-bw-3)),br=1+Math.floor(R()*(rows-bh-2));
  for(let r=br;r<br+bh;r++)for(let c=bc;c<bc+bw;c++)m[r][c]='B';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(m[r][c]==='B')continue;
    const dc=Math.max(bc-c,0,c-(bc+bw-1)),dr=Math.max(br-r,0,r-(br+bh-1)),dist=Math.max(dc,dr),p=R();
    m[r][c]=(dist>=2&&p<.55)?'H':p<.62?'P':'.';
  }
  for(let k=0;k<10;k++){const c=1+Math.floor(R()*(cols-2)),r=1+Math.floor(R()*(rows-2));
    if(m[r][c]!=='B'&&m[r][c+1]!=='B'&&m[r+1][c]!=='B'&&m[r+1][c+1]!=='B'){m[r][c]=m[r][c+1]=m[r+1][c]=m[r+1][c+1]='W';break}}
  for(let k=0;k<30;k++){const c=Math.floor(R()*cols),r=Math.floor(R()*rows);if(m[r][c]==='P'||m[r][c]==='.'){m[r][c]='C';break}}
  const base=LEVELS[weekly?6:5];
  return Object.assign({},base,{map:m.map(row=>row.join('')),seed:key+tries});
}

const WALLS=['#e9dfcc','#d9c7ad','#cdd4c0','#c9d3de','#e5d0cc','#d8d2c4'];
const ROOFS=['#8a4b3a','#6d4a3d','#4d535c','#5b3f33','#7a5a45','#3f464f'];
const APTS=['#e9d5b8','#d6c4e3','#c9dcd0','#f0cfc4'];
const GLASS=['#a4c8e8','#b8d4ea','#8fb6dc','#a9cfe4','#c2d8ea'];

function buildCity(L){
  const rows=L.map.length, cols=L.map[0].length, R=rng(L.seed);
  const nodes=[];
  for(let r=0;r<=rows;r++)for(let c=0;c<=cols;c++)nodes.push({id:r*(cols+1)+c,c,r,x:MARGIN+c*S,y:MARGIN+r*S,adj:[],alive:false});
  const blk=(c,r)=>(r>=0&&r<rows&&c>=0&&c<cols)?L.map[r][c]:'.';
  const cls=ch=>ch==='W'?'W':(ch==='P'||ch==='C')?'P':'';
  const id=(c,r)=>r*(cols+1)+c;
  const edges=[],edgeMap=new Map();
  function addEdge(a,b,name){const e={id:edges.length,a,b,len:S,closed:false,name};edges.push(e);nodes[a].adj.push({to:b,e});nodes[b].adj.push({to:a,e});edgeMap.set(a*4096+b,e);edgeMap.set(b*4096+a,e)}
  for(let r=0;r<=rows;r++)for(let c=0;c<=cols;c++){
    if(c<cols){const A=cls(blk(c,r-1)),B=cls(blk(c,r));if(!(A&&A===B))addEdge(id(c,r),id(c+1,r),HN[r]+' Street')}
    if(r<rows){const A=cls(blk(c-1,r)),B=cls(blk(c,r));if(!(A&&A===B))addEdge(id(c,r),id(c,r+1),ord(c+1)+' Avenue')}
  }
  for(const n of nodes)n.alive=n.adj.length>0;
  const blocks=[],items=[],homes=[],works=[],landmarks={};let venue=null;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const t=L.map[r][c],bx=MARGIN+c*S,by=MARGIN+r*S,R=rng(L.seed*977+r*131+c*7+1);
    blocks.push({c,r,x:bx,y:by,t});
    const slot=(i,j)=>[bx+16+17+34*i+(R()-.5)*3,by+16+17+34*j+(R()-.5)*3];
    if(t==='H'){
      const all=[[0,0],[1,0],[0,1],[1,1]];let use=all.filter(()=>R()<.85);if(use.length<3)use=all.slice(0,3);
      const apt=R()<.3?Math.floor(R()*use.length):-1;
      use.forEach((s,k)=>{const[x,y]=slot(s[0],s[1]);
        const b=k===apt?{type:'home',kind:'apt',x,y,w:27,d:26,h:22+R()*8,col:pick(R,APTS)}:{type:'home',kind:'house',x,y,w:21+R()*5,d:17+R()*4,h:9+R()*4,col:pick(R,WALLS),roof:pick(R,ROOFS)};
        items.push({k:'b',y:y+b.d/2,b});homes.push(b);if(k===apt)homes.push(b)});
      if(R()<.6)items.push({k:'t',y:by+50,x:bx+50,s:.8,v:R()<.5});
    }else if(t==='B'){
      const all=[[0,0],[1,0],[0,1],[1,1]];let use=all.filter(()=>R()<.8);if(use.length<3)use=all.slice(0,3);
      for(const s of use){const[x,y]=slot(s[0],s[1]);const b={type:'work',x,y,w:25,d:25,h:20+R()*26,col:pick(R,GLASS)};items.push({k:'b',y:y+b.d/2,b});works.push(b)}
    }else if(LMK[t]){
      const D=LMK[t],b={type:'landmark',kind:D.kind,x:bx+50,y:by+D.y,w:D.w,d:D.d,h:D.h};
      landmarks[b.kind]=b;items.push({k:'b',y:b.y+b.d/2,b});
      if(t==='U'||t==='K'||t==='O')for(let k=0;k<4;k++)items.push({k:'t',y:by+78+R()*10,x:bx+16+k*22,s:.7,v:R()<.5});
    }else if(t==='C'){
      venue={type:'venue',x:bx+50,y:by+52,w:62,d:46,h:12};items.push({k:'b',y:venue.y+venue.d/2,b:venue});
      for(let k=0;k<4;k++)items.push({k:'t',y:by+22+R()*60,x:bx+(k%2?86:14)+(R()-.5)*6,s:.8,v:R()<.5});
    }else if(t==='P'){
      for(let k=0;k<7;k++)items.push({k:'t',y:by+14+R()*72,x:bx+14+R()*72,s:.7+R()*.5,v:R()<.5});
    }else if(t==='.'){
      for(let k=0;k<3;k++)items.push({k:'t',y:by+18+R()*64,x:bx+18+R()*64,s:.7+R()*.4,v:R()<.5});
    }
  }
  items.sort((a,b)=>a.y-b.y);
  // connectivity check
  const alive=nodes.filter(n=>n.alive),seen=new Set([alive[0].id]),q=[alive[0].id];
  while(q.length){const n=nodes[q.pop()];for(const a of n.adj)if(!seen.has(a.to)){seen.add(a.to);q.push(a.to)}}
  const connected=seen.size===alive.length;
  const city={L,nodes,edges,edgeMap,blocks,items,homes,works,venue,landmarks,cols,rows,w:MARGIN*2+cols*S,h:MARGIN*2+rows*S,seed:L.seed,connected};
  city.img=renderStatic(city);
  return city;
}

function mkCanvas(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c}
function noiseTile(R,size,base,amt,alpha){
  return mkCanvas(size,size,(g,w,h)=>{
    const id=g.createImageData(w,h);
    for(let i=0;i<w*h;i++){const v=base+(R()-.5)*amt;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=alpha}
    g.putImageData(id,0,0);
  });
}
function renderStatic(city){
  const sc=Math.min(2.6,3600/city.w,3200/city.h),cv=document.createElement('canvas');
  cv.width=Math.ceil(city.w*sc);cv.height=Math.ceil(city.h*sc);
  const g=cv.getContext('2d');g.scale(sc,sc);
  const R=rng(city.seed*7+3),map=city.L.map,rows=city.rows,cols=city.cols;
  const bt=(c,r)=>(r>=0&&r<rows&&c>=0&&c<cols)?map[r][c]:'.';
  const grain=noiseTile(R,128,128,255,255);
  const grainFill=g.createPattern(grain,'repeat');
  function grainOver(x,y,w,h,a){g.save();g.globalCompositeOperation='overlay';g.globalAlpha=a;g.fillStyle=grainFill;g.fillRect(x,y,w,h);g.restore()}
  function blotches(x,y,w,h,cols_,n,rmin,rmax,a){
    for(let i=0;i<n;i++){
      const bx=x+R()*w,by=y+R()*h,r=rmin+R()*(rmax-rmin),c=cols_[Math.floor(R()*cols_.length)];
      const gr=g.createRadialGradient(bx,by,0,bx,by,r);gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');
      g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.globalAlpha=a;g.fillStyle=gr;g.fillRect(bx-r,by-r,r*2,r*2);g.restore();
    }
  }
  function blades(x,y,w,h,n,cl){
    g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.lineWidth=.6;
    for(let i=0;i<n;i++){const bx=x+R()*w,by=y+R()*h;g.strokeStyle=cl[Math.floor(R()*cl.length)];g.globalAlpha=.35+R()*.4;g.beginPath();g.moveTo(bx,by);g.lineTo(bx+(R()-.5)*1.6,by-1.6-R()*2.2);g.stroke()}
    g.restore();
  }
  // ground
  g.fillStyle='#6b974b';g.fillRect(0,0,city.w,city.h);
  blotches(0,0,city.w,city.h,['#82ad5a','#587f3d','#8fb566','#6a8f45'],Math.round(city.w*city.h/9000),50,140,.35);
  blades(0,0,city.w,city.h,Math.round(city.w*city.h/9),['#4d7433','#86b25d','#9bbd6e','#5b8740']);
  grainOver(0,0,city.w,city.h,.5);
  // blocks
  for(const b of city.blocks){
    const x=b.x,y=b.y;
    if(b.t==='H'){
      g.fillStyle='#78a553';g.fillRect(x+10,y+10,S-20,S-20);
      blotches(x,y,S,S,['#8db764','#628a45'],5,15,40,.4);
      blades(x+10,y+10,S-20,S-20,500,['#4d7433','#9bc26a','#86b25d']);
      g.strokeStyle='#4c7a37';g.lineWidth=2;g.strokeRect(x+14.5,y+14.5,S-29,S-29); // hedge
      g.strokeStyle='rgba(30,60,25,.35)';g.lineWidth=1;g.strokeRect(x+16,y+16,S-32,S-32);
    }else if(b.t==='B'||LMK[b.t]){
      g.fillStyle='#b9bec3';g.fillRect(x+6,y+6,S-12,S-12);
      g.strokeStyle='rgba(90,98,106,.55)';g.lineWidth=.5;
      for(let k=6;k<=S-6;k+=8){g.beginPath();g.moveTo(x+k,y+6);g.lineTo(x+k,y+S-6);g.moveTo(x+6,y+k);g.lineTo(x+S-6,y+k);g.stroke()}
      g.fillStyle='#5f8f47';for(const[px,py]of[[10,10],[S-22,10],[10,S-22],[S-22,S-22]])g.fillRect(x+px,y+py,12,12);
      grainOver(x,y,S,S,.35);
    }else if(b.t==='P'||b.t==='C'){
      g.fillStyle='#5e9446';g.fillRect(x,y,S,S);
      blotches(x,y,S,S,['#74a955','#4d8038','#86b566'],8,15,45,.45);
      blades(x,y,S,S,900,['#3f6b2c','#8fc063','#6fa24a']);
      if(b.t==='P'){
        g.strokeStyle='#d6c9a4';g.lineWidth=3.6;g.lineCap='round';g.beginPath();g.moveTo(x+4,y+30+R()*40);g.bezierCurveTo(x+30,y+10,x+60,y+90,x+S-4,y+30+R()*40);g.stroke();
        g.strokeStyle='rgba(120,105,70,.5)';g.lineWidth=.8;g.stroke();
        for(let k=0;k<26;k++){g.fillStyle=['#f4e04d','#f28fb3','#fff','#c68be8'][k%4];g.beginPath();g.arc(x+8+R()*84,y+8+R()*84,.9,0,6.3);g.fill()}
      }
    }else if(b.t==='W'){
      const sides=[[0,-1],[0,1],[-1,0],[1,0]];
      g.fillStyle='#1d5b73';g.fillRect(x,y,S,S);
      g.fillStyle='#a3a49c';
      const c=b.c,r=b.r;
      if(bt(c,r-1)!=='W')g.fillRect(x,y,S,5);
      if(bt(c,r+1)!=='W')g.fillRect(x,y+S-5,S,5);
      if(bt(c-1,r)!=='W')g.fillRect(x,y,5,S);
      if(bt(c+1,r)!=='W')g.fillRect(x+S-5,y,5,S);
    }else{
      g.fillStyle='#6f9a4d';g.fillRect(x,y,S,S);
      g.fillStyle='rgba(133,112,76,.5)';g.beginPath();g.ellipse(x+30+R()*40,y+30+R()*40,16+R()*18,10+R()*12,R()*3,0,6.3);g.fill();
      blades(x,y,S,S,500,['#4d7433','#a6a06a','#86b25d']);
    }
  }
  // driveways & pads for houses, parking beside arena
  for(const it of city.items){
    if(it.k!=='b')continue;const b=it.b;
    if(b.type==='home'){
      const by=MARGIN+Math.floor((b.y-MARGIN)/S)*S;
      g.fillStyle='#b5b3aa';g.fillRect(b.x-2.2,b.y+b.d/2,4.4,Math.max(3,by+S-14-(b.y+b.d/2)));
      g.fillStyle='#8c8a84';g.fillRect(b.x-b.w/2-6,b.y+b.d/2-3,5,10);
    }else if(b.type==='venue'){
      const bx=MARGIN+Math.floor((b.x-MARGIN)/S)*S,by=MARGIN+Math.floor((b.y-MARGIN)/S)*S;
      g.fillStyle='#4a4f55';g.fillRect(bx+6,by+S-26,S-12,20);
      g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=.7;for(let k=10;k<S-8;k+=6){g.beginPath();g.moveTo(bx+k,by+S-26);g.lineTo(bx+k,by+S-14);g.stroke()}
    }
  }
  // ambient occlusion under things
  g.save();
  for(const it of city.items){
    if(it.k==='t'){g.fillStyle='rgba(15,35,10,.30)';g.shadowColor='rgba(10,30,8,.6)';g.shadowBlur=7*sc;g.beginPath();g.ellipse(it.x+1,it.y,6*it.s,3.4*it.s,0,0,6.3);g.fill()}
    else{const b=it.b;g.fillStyle='rgba(0,0,0,.35)';g.shadowColor='rgba(0,0,0,.65)';g.shadowBlur=12*sc;
      if(b.type==='venue'){g.beginPath();g.ellipse(b.x,b.y,b.w/2+2,b.d/2+2,0,0,6.3);g.fill()}else g.fillRect(b.x-b.w/2-1,b.y-b.d/2-1,b.w+2,b.d+2)}
  }
  g.restore();
  // roads
  const asphalt=g.createPattern(mkCanvas(128,128,(a,w,h)=>{a.fillStyle='#3a3f45';a.fillRect(0,0,w,h);
    for(let i=0;i<900;i++){a.fillStyle=['#4b5158','#2f3338','#555b62','#33383d'][i%4];a.globalAlpha=.5;a.fillRect(R()*w,R()*h,1+R()*1.4,1+R()*1.4)}
    a.globalAlpha=.22;a.strokeStyle='#22262a';a.lineWidth=.6;for(let i=0;i<5;i++){a.beginPath();a.moveTo(R()*w,R()*h);a.lineTo(R()*w,R()*h);a.stroke()}}),'repeat');
  const pave=g.createPattern(mkCanvas(64,64,(a,w,h)=>{a.fillStyle='#c9c9c2';a.fillRect(0,0,w,h);a.strokeStyle='#a9a9a2';a.lineWidth=1;
    for(let i=0;i<=w;i+=16){a.beginPath();a.moveTo(i,0);a.lineTo(i,h);a.moveTo(0,i);a.lineTo(w,i);a.stroke()}
    for(let i=0;i<120;i++){a.fillStyle='rgba(120,120,110,.18)';a.fillRect(R()*w,R()*h,1.5,1.5)}}),'repeat');
  const N=city.nodes;
  g.lineCap='round';g.lineJoin='round';
  for(const e of city.edges){const A=N[e.a],B=N[e.b];g.strokeStyle=pave;g.lineWidth=ROAD_W+10;g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.stroke()}
  for(const e of city.edges){const A=N[e.a],B=N[e.b];g.strokeStyle='#8f918c';g.lineWidth=ROAD_W+3;g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.stroke()}
  for(const e of city.edges){const A=N[e.a],B=N[e.b];g.strokeStyle=asphalt;g.lineWidth=ROAD_W;g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.stroke()}
  g.lineCap='butt';
  for(const e of city.edges){
    const A=N[e.a],B=N[e.b],dx=B.x-A.x,dy=B.y-A.y,l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l,nx=-uy,ny=ux,s0=15,s1=l-15;
    g.strokeStyle='rgba(15,16,18,.20)';g.lineWidth=3.4;
    for(const o of[-5.5,5.5]){g.beginPath();g.moveTo(A.x+ux*s0+nx*o,A.y+uy*s0+ny*o);g.lineTo(A.x+ux*s1+nx*o,A.y+uy*s1+ny*o);g.stroke()}
    g.strokeStyle='rgba(235,235,225,.55)';g.lineWidth=.8;
    for(const o of[-(ROAD_W/2-1.6),ROAD_W/2-1.6]){g.beginPath();g.moveTo(A.x+ux*s0+nx*o,A.y+uy*s0+ny*o);g.lineTo(A.x+ux*s1+nx*o,A.y+uy*s1+ny*o);g.stroke()}
    g.strokeStyle='rgba(245,245,238,.88)';g.lineWidth=1.3;g.setLineDash([9,11]);
    g.beginPath();g.moveTo(A.x+ux*s0,A.y+uy*s0);g.lineTo(A.x+ux*s1,A.y+uy*s1);g.stroke();g.setLineDash([]);
    const mx=A.x+ux*l*(.3+R()*.4)+nx*(R()-.5)*8,my=A.y+uy*l*(.3+R()*.4)+ny*(R()-.5)*8;
    g.fillStyle='#2a2d31';g.beginPath();g.arc(mx,my,1.7,0,6.3);g.fill();g.strokeStyle='rgba(120,125,130,.5)';g.lineWidth=.4;g.stroke();
  }
  // crosswalks
  for(const n of N){if(!n.alive)continue;
    for(const a of n.adj){
      const B=N[a.to],dx=B.x-n.x,dy=B.y-n.y,l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l,nx=-uy,ny=ux,cx=n.x+ux*(ROAD_W/2+8),cy=n.y+uy*(ROAD_W/2+8);
      g.strokeStyle='rgba(245,245,240,.9)';g.lineWidth=1.5;
      for(let k=-4;k<=4;k++){const ox=nx*k*2.45,oy=ny*k*2.45;g.beginPath();g.moveTo(cx+ox-ux*3.4,cy+oy-uy*3.4);g.lineTo(cx+ox+ux*3.4,cy+oy+uy*3.4);g.stroke()}
      g.lineWidth=1.8;g.beginPath();g.moveTo(cx+ux*7.2+nx*-ROAD_W/2,cy+uy*7.2+ny*-ROAD_W/2);g.lineTo(cx+ux*7.2+nx*ROAD_W/2,cy+uy*7.2+ny*ROAD_W/2);g.stroke();
    }
  }
  return cv;
}

const G={L:null,city:null,levelIdx:0,stops:new Map(),routes:[],buses:[],citizens:[],parts:[],
  day:1,t:0,speed:1,paused:true,modal:true,over:false,nid:1,netVer:1,acc:0,
  delivered:0,gaveUp:0,dayDel:0,dayGave:0,win:[],event:null,evPlan:[],lastEv:'',stormMult:1,routeCount:0,
  flashSat:0,tg:null,tgVer:-1,money:0,rev:0,cost:0,dayRev:0,dayCost:0,engine:0,pendingNext:false,congT:0,lastPhase:'',depots:new Map(),rival:{stops:[],routes:[]},missions:[],mDel:0,mClears:0,mDest:{},prioCD:0,season:'spring',lostRival:0,dayLost:0,snap:null,reactT:0,lmT:0,xpDay:0};
const ui={undo:[],undoSig:'',shape:null,tool:'select',drawing:null,sel:null,sheet:false,hover:null,dirty:true,sound:true,hintOverride:'',moving:null,view:'off',follow:null,photo:false};
let W=0,H=0,dpr=1;
const cv=$('#cv');

/* ================= sound ================= */
let AC=null;const lastSnd={};
function tone(f,d,type,vol,when,slide){
  if(!ui.sound||!AC)return;
  try{const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
function snd(k){
  const n=performance.now();if(lastSnd[k]&&n-lastSnd[k]<90)return;lastSnd[k]=n;
  if(k==='pop')tone(520+rnd()*120,.07,'sine',.04);
  else if(k==='cheer'){tone(523,.14,'triangle',.07);tone(659,.14,'triangle',.07,.08);tone(784,.22,'triangle',.07,.16)}
  else if(k==='sad')tone(220,.25,'sawtooth',.03,0,140);
  else if(k==='alert'){tone(660,.16,'square',.04);tone(440,.24,'square',.04,.18)}
  else if(k==='deliver')tone(880,.08,'sine',.03);
  else if(k==='alert2'){tone(740,.1,'triangle',.05);tone(587,.16,'triangle',.05,.1)}
  else if(k==='full')tone(180,.12,'square',.03);
  else if(k==='door')doorSound();
}
function ensureAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C){AC=new C();audioStart()}}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
let AUD=null;
function noiseBuf(){const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=w*.5+l*3}return b}
function audioStart(){
  const nb=noiseBuf(),mk=(f,type,g)=>{const src=AC.createBufferSource();src.buffer=nb;src.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;const gn=AC.createGain();gn.gain.value=0;src.connect(fl);fl.connect(gn);gn.connect(AC.destination);src.start();return gn};
  const eo=AC.createOscillator(),ef=AC.createBiquadFilter(),eg=AC.createGain();eo.type='sawtooth';eo.frequency.value=58;ef.type='lowpass';ef.frequency.value=200;eg.gain.value=0;eo.connect(ef);ef.connect(eg);eg.connect(AC.destination);eo.start();
  AUD={amb:mk(420,'lowpass'),rain:mk(1400,'highpass'),eng:eg,eo,nb};
}
function audioUpdate(){
  if(!AUD||!AC)return;
  musicTick();
  const on=ui.sound&&!G.modal,t=AC.currentTime,run=on&&!G.paused;

/* ================= road graph ================= */
const edgeBetween=(a,b)=>G.city.edgeMap.get(a*4096+b);
function roadPath(a,b,avoid){
  if(a===b)return[a];
  const N=G.city.nodes,dist=new Map([[a,0]]),prev=new Map(),done=new Set();
  while(true){
    let u=-1,ud=1e18;
    for(const[k,d]of dist)if(!done.has(k)&&d<ud){ud=d;u=k}
    if(u<0)return null;
    if(u===b)break;
    done.add(u);
    for(const nb of N[u].adj){
      if(avoid&&nb.e.closed)continue;
      const nd=ud+nb.e.len;
      if(!dist.has(nb.to)||nd<dist.get(nb.to)){dist.set(nb.to,nd);prev.set(nb.to,u)}
    }
  }
  const p=[b];let c=b;while(c!==a){c=prev.get(c);p.push(c)}
  return p.reverse();
}

/* ================= transit planning ================= */
const busSpeed=r=>BUS_SPEED*(r.express?1.7:1)*BUS_MODELS[r.model||0].spd*(1+.12*G.engine)*(G.fogMult||1)*(G.season==='winter'?.9:1);
const rushNow=()=>!!phaseAt(G.t).p.rush;
function routeActive(r){const p=phaseAt(G.t).p;return p.night?!!r.night:(r.sched!=='peak'||!!p.rush)}
function isServed(r,sid){const i=r.stops.indexOf(sid);return i>=0&&(!r.express||i===0||i===r.stops.length-1)}
function buildTG(){
  const adj=new Map(),rush=rushNow();
  for(const r of G.routes){
    const nb=r.buses.length;if(!nb)continue;
    if(!routeActive(r))continue;
    const sp=busSpeed(r),n=r.stops.length,idx=r.express?[0,n-1]:r.stops.map((_,i)=>i);
    const total=r.loop?r.loopLen:r.cum[n-1];
    const cycle=(r.loop?total:2*total)/sp+n*2.4,wait=Math.min(cycle/(2*nb),70),m=idx.length;
    for(let a=0;a<m;a++)for(let b=0;b<m;b++){
      if(a===b)continue;
      const ia=idx[a],ib=idx[b];
      let d;if(r.loop)d=ib>ia?r.cum[ib]-r.cum[ia]:r.loopLen-r.cum[ia]+r.cum[ib];else d=Math.abs(r.cum[ib]-r.cum[ia]);
      const hops=r.loop?((b-a)+m)%m:Math.abs(b-a),from=r.stops[ia];
      if(!adj.has(from))adj.set(from,[]);
      adj.get(from).push({r,to:r.stops[ib],cost:wait+d/sp+hops*1.2});
    }
  }
  G.tg=adj;G.tgVer=G.netVer;
}
function planFrom(sid,dest,acc){
  if(G.tgVer!==G.netVer)buildTG();
  const dist=new Map([[sid,0]]),prev=new Map(),done=new Set();
  while(true){
    let u=null,ud=1e18;
    for(const[k,d]of dist)if(!done.has(k)&&d<ud){ud=d;u=k}
    if(u===null)break;
    done.add(u);
    const es=G.tg.get(u);if(!es)continue;
    for(const e of es){
      if(acc){const t=G.stops.get(e.to);if(!t||!t.access)continue}
      const nd=ud+e.cost;if(!dist.has(e.to)||nd<dist.get(e.to)){dist.set(e.to,nd);prev.set(e.to,{from:u,e})}
    }
  }
  let best=null;
  for(const[id,d]of dist){
    const st=G.stops.get(id);if(!st)continue;
    if(acc&&!st.access)continue;
    const w=Math.hypot(st.x-dest.x,st.y-dest.y);if(w>MAXWALK)continue;
    const tot=d+w/WALK*1.15;
    if(!best||tot<best.tot)best={id,tot};
  }
  if(!best)return null;
  if(best.id===sid)return{exit:true,tot:best.tot};
  let cur=best.id,pe=prev.get(cur);
  while(pe.from!==sid){cur=pe.from;pe=prev.get(cur)}
  return{exit:false,route:pe.e.r,alight:pe.e.to,tot:best.tot};
}

const blockKey=(x,y)=>Math.floor((x-MARGIN)/S)+','+Math.floor((y-MARGIN)/S);
function pickRider(){const ts=G.L.riders;let tot=0;for(const t of ts)tot+=RIDERS[t].w;let x=rnd()*tot;for(const t of ts){x-=RIDERS[t].w;if(x<=0)return t}return ts[0]}
function stopNear(x,y,r){for(const st of G.stops.values())if(Math.hypot(st.x-x,st.y-y)<r)return true;return false}
function react(x,y,txt,col,chance){if(rnd()>(chance==null?1:chance))return;if(G.t-G.reactT<.9&&G.t>=G.reactT)return;G.reactT=G.t;fx.text(x,y-10,txt,col||'#e0509a')}
function rivalSteal(o){
  const rv=G.rival;if(!rv.stops.length)return false;
  let rd=1e9;for(const id of rv.stops){const n=G.city.nodes[id];const d=Math.hypot(n.x-o.x,n.y-o.y);if(d<rd)rd=d}
  if(rd>120)return false;
  let pd=1e9;for(const st of G.stops.values()){const d=Math.hypot(st.x-o.x,st.y-o.y);if(d<pd)pd=d}
  return rnd()<(pd>rd+40?.5:pd>rd?.2:.05);
}
function spawnCitizen(orig,destList){

  if(destList===C.works){

    else if(type==='student'&&lm.school&&stopNear(lm.school.x,lm.school.y,260)&&rnd()<.7)list=[lm.school];
  }
  const R_=RIDERS[type];

    if(type==='tourist'){if(lm.air&&stopNear(lm.air.x,lm.air.y,260)&&rnd()<.7)list=[lm.air];else if(C.venue&&stopNear(C.venue.x,C.venue.y,260))list=[C.venue]}

  }

  const dst=list[Math.floor(rnd()*list.length)],pm=G.L.patience*R_.pm*(has('signs')?1.12:1),fare=Math.max(1,Math.round(R_.fare*(G.fareMult||1)));
  const dk=dst.type==='landmark'?dst.kind:(dst.type==='venue'?'venue':'work'),nt=!!phaseAt(G.t).p.night;
  const c={id:++G.nid,type,fare:nt?Math.round(fare*1.6):fare,state:'walk',x:orig.x,y:orig.y,dest:{x:dst.x,y:dst.y},dk,p:nt?pm*1.3:pm,pm:nt?pm*1.3:pm,stop:null,plan:null,planVer:-1,noRoute:false,retry:0,alight:null,seed:rnd(),wstart:0,lastRoute:null,ob:blockKey(orig.x,orig.y),db:blockKey(dst.x,dst.y)};

function assignStop(c){
  const acc=c.type==='wheel';
  const cand=[...G.stops.values()].filter(s=>!acc||s.access).map(s=>({s,d:Math.hypot(s.x-c.x,s.y-c.y)*(s.bike?.45:1)})).sort((a,b)=>a.d-b.d).slice(0,5);
  let best=null;
  for(const o of cand){
    let pl=planFrom(o.s.id,c.dest,acc);
    if(pl&&pl.exit&&Math.hypot(c.x-c.dest.x,c.y-c.dest.y)>MAXWALK)pl=null;
    if(!pl)continue;
    const sc=o.d/WALK*1.3+pl.tot;
    if(!best||sc<best.sc)best={s:o.s,pl,sc};
  }
  c.state='walk';
  if(best){
    if(best.pl.exit){c.state='walkDest';c.stop=null;c.noRoute=false;return}
    c.stop=best.s;c.plan=best.pl;c.planVer=G.netVer;c.noRoute=false;
  }else if(cand.length){c.stop=cand[0].s;c.plan=null;c.noRoute=true;c.planVer=G.netVer}
  else{c.stop=null;c.noRoute=true;c.retry=1}
}
function joinStop(c){
  const st=c.stop;
  if(!st||G.stops.get(st.id)!==st){assignStop(c);return}
  c.x=st.x;c.y=st.y;c.state='wait';c.wstart=G.t;st.waiters.push(c);replanWaiter(c);
  if(st.waiters.length>(st.peak||0)){st.peak=st.waiters.length;st.peakT=G.t}
}
function replanWaiter(c){

  for(let i=G.bubbles.length-1;i>=0;i--){
    const b=G.bubbles[i];b.t+=dt;

  const pool=[];

  G.thinkMem.push({x:c.x,y:c.y,t:G.t});if(G.thinkMem.length>8)G.thinkMem.shift();

function segPath(r,a,b){
  const v=r.via||{};let via=v[a+'>'+b]||null;

  const pts=[a].concat(via||[],[b]),out=[a];

function legPath(r,from,to){

function shapeTap(n){

function rebuildVis(){

    leaveStop(c);c.state='ride';c.stop=null;c.alight=c.plan.alight;c.bus=b;c.lastBus=b;c.lastRoute=r;b.pax.push(c);boarded++;
    r.stat.boarded++;r.stat.waitSum+=Math.max(0,G.t-c.wstart);
    fx.fly(stop.x,stop.y,b.x,b.y,pcol(c));
  }
  if(cands.length>boarded){b.flash=1.1;stop.missed=1;snd('full')}
  if(boarded)snd('pop');
  if(boarded||out)snd('door');
  const after=stopStatus(stop);
  if(before>0&&after===0&&boarded){if(before===2){G.mClears++;PROF.stat.clears++;if(PROF.stat.clears>=50)ach('clear50');react(stop.x,stop.y-14,'Finally!','#e0509a',.7)}stop.cheer=1;fx.ring(stop.x,stop.y,COL.ok,38);fx.text(stop.x,stop.y-26,'Cleared!',COL.ok);if(before===2)snd('cheer')}
  else if(boarded)fx.text(stop.x,stop.y-22,'+'+boarded,COL.ok);
  let hold=0;
  if(r.spacing&&r.buses.length>1){const nxt=r.loop?(i+1)%n:(eff>0?Math.min(n-1,i+1):Math.max(0,i-1));
    for(const ob of r.buses)if(ob!==b&&ob.state!=='parked'&&ob.tIdx===nxt&&Math.hypot(ob.x-b.x,ob.y-b.y)<115){hold=3.5;break}}

}
function atNode(b){
  const node=b.to;
  if(b.queue.length){
    const nx=b.queue[0],e=edgeBetween(node,nx);
    if(e&&e.closed){
      const p=roadPath(node,b.dst,true);
      if(!p){b.from=node;b.state='blocked';b.retry=1;b.queue=[];return}
      if(p.length<2){arriveStop(b);return}
      applyPath(b,p);return;
    }
    b.from=node;b.to=b.queue.shift();b.s=0;
    const A=G.city.nodes[b.from],B=G.city.nodes[b.to];b.elen=Math.hypot(B.x-A.x,B.y-A.y);
  }else arriveStop(b);
}
function placeBus(b){
  const N=G.city.nodes,A=N[b.from],B=N[b.to],t=b.elen?clamp(b.s/b.elen,0,1):1;
  const dx=B.x-A.x,dy=B.y-A.y,l=Math.hypot(dx,dy);
  if(l>0){b.ang=Math.atan2(dy,dx);b.nx=-dy/l;b.ny=dx/l}
  b.x=A.x+dx*t+b.nx*5.5;b.y=A.y+dy*t+b.ny*5.5;
}
function updBus(b,dt){
  if(b.flash>0)b.flash-=dt;
  if(b.broke>0){b.broke-=dt;b.flash=Math.max(b.flash,.3);placeBus(b);return}
  if(b.state==='parked'){if(routeActive(b.route))beginLeg(b);placeBus(b);return}
  if(b.state==='dwell'){b.dwell-=dt;if(b.dwell<=0){if(!routeActive(b.route)&&!b.pax.length)b.state='parked';else beginLeg(b)}placeBus(b);return}
  if(b.state==='blocked'){
    b.retry-=dt;
    if(b.retry<=0){b.retry=1;const p=roadPath(b.to,b.dst,true);if(p&&p.length>1)applyPath(b,p);else if(p)arriveStop(b)}
    placeBus(b);return;
  }
  const e=edgeBetween(b.from,b.to),cg=(e&&b.route.model!==3)?(e.cong||0):0;
  const ds=G.stops.get(b.dst),boost=(ds&&ds.prio>0)?1.6:1;
  let move=busSpeed(b.route)*drvPerk(b).spd*(1-cg*(b.route.lane?.25:1)*(has('smartlights')?.75:1))*boost*dt,guard=0;
  while(move>0&&b.state==='drive'&&guard++<30){
    const rem=b.elen-b.s;
    if(move<rem){b.s+=move;move=0}else{move-=rem;b.s=b.elen;atNode(b)}
  }
  placeBus(b);
}

/* ================= stops ================= */
function stopCorner(city,nd){
  const has=(dx,dy)=>nd.adj.some(a=>{const B=city.nodes[a.to];return Math.sign(B.x-nd.x)===dx&&Math.sign(B.y-nd.y)===dy});
  const order=[[1,1],[-1,1],[1,-1],[-1,-1]];let best=order[0],bs=-1;
  for(const[sx,sy]of order){const sc=(has(sx,0)?1:0)+(has(0,sy)?1:0);if(sc>bs){bs=sc;best=[sx,sy]}}
  return best;
}
function nodeName(n){return HN[n.r]+' & '+ord(n.c+1)}
function addStop(nid,free){
  if(G.stops.has(nid))return G.stops.get(nid);
  if(!free){if(G.money<PRICE.stop){toast('Not enough cash for a stop ($'+PRICE.stop+').');return null}G.money-=PRICE.stop}
  const n=G.city.nodes[nid];
  const[sx,sy]=stopCorner(G.city,n),st={id:nid,x:n.x+sx*14,y:n.y+sy*14,sx,sy,waiters:[],cheer:0,missed:0,access:false,gaveDay:0,peak:0,peakT:0};
  G.stops.set(nid,st);G.netVer++;ui.dirty=true;if(G.stops.size>=10)ach('ten_stops');
  for(const c of G.citizens)if(c.state==='walk'&&!c.stop)c.retry=0;
  return st;
}
function makeAccessible(id){
  const st=G.stops.get(id);if(!st)return;
  if(st.access){toast('This stop already has a ramp.');return}
  if(G.money<PRICE.ramp){toast('A step-free ramp costs $'+PRICE.ramp+'.');return}
  G.money-=PRICE.ramp;st.access=true;ach('access');G.netVer++;ui.dirty=true;snd('pop');toast('Step-free access added.');
  for(const c of G.citizens)if(c.type==='wheel'&&c.state==='walk'&&!c.stop)c.retry=0;
}
function moveStop(oid,nid){
  const st=G.stops.get(oid);if(!st||oid===nid)return false;
  if(G.stops.has(nid)){toast('There is already a stop there.');return false}
  if(G.money<PRICE.move){toast('Moving a stop costs $'+PRICE.move+'.');return false}
  G.money-=PRICE.move;
  const ns=addStop(nid,true);ns.access=st.access;ns.gaveDay=st.gaveDay;
  for(const r of G.routes){const i=r.stops.indexOf(oid);if(i>=0){r.stops[i]=nid;recalcRoute(r)}}
  for(const b of G.buses)for(const c of b.pax)if(c.alight===oid)c.alight=nid;
  for(const c of st.waiters.slice()){c.state='walk';c.stop=ns;c.planVer=-1}
  st.waiters=[];
  for(const c of G.citizens)if(c.stop===st&&c.state!=='ride'){c.stop=ns;c.planVer=-1}
  G.stops.delete(oid);
  if(ui.sel&&ui.sel.type==='stop'&&ui.sel.id===oid)ui.sel={type:'stop',id:nid};
  ui.moving=null;netChanged();snd('pop');return true;
}
function removeStop(nid){
  const st=G.stops.get(nid);if(!st)return;
  for(const r of G.routes.slice()){
    const i=r.stops.indexOf(nid);
    if(i>=0){r.stops.splice(i,1);if(r.stops.length<2)deleteRoute(r);else{recalcRoute(r)}}
  }
  G.stops.delete(nid);
  if(ui.sel&&ui.sel.type==='stop'&&ui.sel.id===nid)ui.sel=null;
  if(ui.drawing&&ui.drawing.first===nid)ui.drawing=null;
  for(const c of st.waiters.slice()){c.stop=null;c.state='walk';assignStop(c)}
  st.waiters=[];
  for(const c of G.citizens)if(c.stop===st&&c.state!=='ride'){c.stop=null;assignStop(c)}
  netChanged();
}
function routesAt(sid){return G.routes.filter(r=>r.stops.includes(sid))}

/* ================= events ================= */
function connectedWithout(edge){
  const N=G.city.nodes;edge.closed=true;
  const alive=N.filter(n=>n.alive),seen=new Set([alive[0].id]),q=[alive[0].id];
  while(q.length){const n=N[q.pop()];for(const a of n.adj)if(!a.e.closed&&!seen.has(a.to)){seen.add(a.to);q.push(a.to)}}
  edge.closed=false;return seen.size===alive.length;
}
function planEvents(){
  const L=G.L;G.evPlan=[];
  const pool=L.days<=3&&!L.daily&&L.cash<2000?['closure','concert','storm','breakdown']:['closure','concert','storm','breakdown','parade','fog'];
  if(G.day>=2||L.days>3){pool.push('accident');pool.push(G.season==='winter'?'snow':'flood')}
  const types=pool.filter(t=>t!==G.lastEv);
  let t1=types[Math.floor(rnd()*types.length)];if(G.season==='spring'&&types.includes('storm')&&rnd()<.35)t1='storm';
  G.evPlan.push({phase:'pm',at:3+rnd()*8,type:t1});G.lastEv=t1;
  if(rnd()<L.amProb){const am=['closure','storm','breakdown','fog'].filter(t=>pool.includes(t));G.evPlan.push({phase:'am',at:6+rnd()*10,type:am[Math.floor(rnd()*am.length)]})}
}
function startEvent(ev){

    let pool=[...used];if(!pool.length)pool=city.edges.filter(e=>{const a=city.nodes[e.a];return a.c>=3&&a.c<=6});
    pool=pool.filter(e=>connectedWithout(e));

  }

    const used=new Set();

    let pool=[...used];if(!pool.length)pool=city.edges.filter(e=>{const a=city.nodes[e.a];return a.c>=2&&a.c<=7});
    const M_=G.L.map,wet=n=>{for(const[dc,dr]of[[-1,-1],[0,-1],[-1,0],[0,0]]){const r=n.r+dr,c=n.c+dc;if(M_[r]&&M_[r][c]==='W')return true}return false};

      const e=pool[Math.floor(rnd()*pool.length)],edges=[e];e.closed=true;
      if(type==='flood'){const p2=pool.filter(x=>x!==e&&connectedWithout(x));if(p2.length){const e2=p2[Math.floor(rnd()*p2.length)];e2.closed=true;edges.push(e2)}}
      const names=edges.map(x=>x.name).join(' and ');
      if(type==='accident'){e.accident=true;const dur=(G.city.landmarks&&G.city.landmarks.hosp)?15:23;G.event={type:'accident',t:0,dur,edges,label:'Accident on '+names+'. Emergency crews are on scene.'+((G.city.landmarks&&G.city.landmarks.hosp)?' The hospital speeds them up.':'')};toast('Accident! Buses will detour.')}

      else{G.event={type:'snow',t:0,dur:40,edges,label:'Snow is blocking '+names+'. Everything moves slower.'};G.fogMult=.86;toast('Snow! Buses will detour.')}
    }
  }
  if(type==='concert'){
    if(!city.venue)type='storm';
    else G.event={type:'concert',t:0,dur:22,left:G.L.concert,total:G.L.concert,spawnDur:14,acc:0,label:'Concert just ended. A big crowd is heading home.'};
  }
  if(type==='breakdown'){
    const bs=G.buses.filter(b=>b.state!=='parked');
    if(!bs.length)type='storm';
    else{const b=bs[Math.floor(rnd()*bs.length)];b.broke=b.route.depot?11:22;G.event={type:'breakdown',t:0,dur:b.broke,bus:b,label:'A bus on '+b.route.name+' has broken down. A tow truck is on the way.'};toast('Breakdown! Add another bus to cover the gap.')}
  }
  if(type==='parade'){
    const ctr={x:city.w/2,y:city.h/2},nodes=city.nodes.filter(n=>n.alive).sort((a,b)=>Math.hypot(a.x-ctr.x,a.y-ctr.y)-Math.hypot(b.x-ctr.x,b.y-ctr.y)).slice(0,8);
    const nd=nodes[Math.floor(rnd()*nodes.length)],closed=[];
    for(const a of nd.adj){if(closed.length>=2)break;if(connectedWithout(a.e)){a.e.closed=true;closed.push(a.e)}}
    if(!closed.length)type='storm';
    else{G.event={type:'parade',t:0,dur:G.L.closureDur,edges:closed,label:'A parade is blocking '+closed.map(e=>e.name).join(' and ')+'.'};toast('Parade! Buses will detour.')}
  }
  if(type==='fog'){G.event={type:'fog',t:0,dur:40,label:'Dense fog. Buses and traffic slow down.'};G.fogMult=.82}
  if(type==='storm')G.event={type:'storm',t:0,dur:35,label:'Heavy rain. Riders lose patience faster.'};
  G.stormMult=G.event&&(G.event.type==='storm'||G.event.type==='flood')?1.6:1;

}
function endEvent(){
  const ev=G.event;if(!ev)return;
  if(ev.type==='closure'){ev.edge.closed=false;toast('Road reopened.')}
  if(ev.type==='parade'){for(const e of ev.edges)e.closed=false;toast('The parade is over. Roads reopened.')}
  if(ev.type==='accident'||ev.type==='flood'||ev.type==='snow'){for(const e of ev.edges){e.closed=false;e.accident=false}toast('Roads reopened.')}

/* ================= simulation step ================= */
function phaseAt(t){
  let a=0;
  for(let i=0;i<PH.length;i++){const p=PH[i];if(t<a+p.len)return{p,pt:t-a,i};a+=p.len}
  const p=PH[PH.length-1];return{p,pt:p.len,i:PH.length-1};
}
function clockHour(t){const ph=phaseAt(t);return ph.p.from+(ph.p.to-ph.p.from)*clamp(ph.pt/ph.p.len,0,1)}
function updCong(){
  const C=G.city,ph=phaseAt(G.t).p,rf=ph.rush?1:ph.id==='mid'?.35:.15;
  if(!C.congInit){
    const cx=C.w/2,cy=C.h/2,mr=Math.hypot(cx,cy)*.75,R=rng(C.seed+9);
    for(const e of C.edges){const A=C.nodes[e.a],B=C.nodes[e.b];e.dn=clamp(Math.hypot((A.x+B.x)/2-cx,(A.y+B.y)/2-cy)/mr,0,1);e.cb=R()*.1}
    C.congInit=true;
  }
  const cnt=new Map();
  for(const b of G.buses){const e=edgeBetween(b.from,b.to);if(e)cnt.set(e,(cnt.get(e)||0)+1)}
  for(const e of C.edges)e.cong=clamp(rf*.42*Math.pow(1-e.dn,1.3)+e.cb*rf+Math.max(0,(cnt.get(e)||0)-1)*.1,0,.65);
}
function step(dt){
  if(G.over)return;
  G.t+=dt;
  const ph=phaseAt(G.t),L=G.L,total=L.perDay*(1+.12*(G.day-1))*(G.season==='summer'?1.12:1);
  if(ph.p.id!==G.lastPhase){G.lastPhase=ph.p.id;G.netVer++;G.congT=0}
  G.congT-=dt;if(G.congT<=0){G.congT=.5;updCong()}
  if(!ph.p.night||G.routes.some(r=>r.night&&r.buses.length))G.acc+=total*ph.p.share/ph.p.len*dt;
  while(G.acc>=1){
    G.acc-=1;
    const kind=ph.p.dir==='mix'?(rnd()<.5?'home':'work'):ph.p.dir;
    const C=G.city,lm=C.landmarks||{};
    if(kind==='home')spawnCitizen(C.homes[Math.floor(rnd()*C.homes.length)],C.works);
    else{
      let o=C.works[Math.floor(rnd()*C.works.length)];
      if(rnd()<.18){const l=[lm.uni,lm.air,lm.hosp,lm.school,lm.mall].filter(Boolean);if(l.length)o=l[Math.floor(rnd()*l.length)]}
      spawnCitizen(o,C.homes);
    }
  }
  for(const ev of G.evPlan)if(!ev.done&&ph.p.id===ev.phase&&ph.pt>=ev.at&&!G.event)startEvent(ev);
  const ev=G.event;
  if(ev){ev.t+=dt;if(ev.t>=ev.dur)endEvent()}
  updCitizens(dt);thinkTick(dt);rivalTick(dt);
  const eco=(has('electric')?.7:1);
  for(const b of G.buses){
    updBus(b,dt);
    if(b.state!=='parked'){const c=BUS_MODELS[b.route.model||0].cost*dt*eco*(b.route.depot?.85:1)*(ph.p.night?1.25:1);G.money-=c;G.cost+=c;G.dayCost+=c;b.route.stat.cost+=c}
  }
  for(const r of G.routes){if(r.buses.length){let f=0;for(const b of r.buses)f+=b.pax.length/b.cap;r.stat.loadSum+=f/r.buses.length*dt;r.stat.loadN+=dt}}
  if(G.prioCD>0)G.prioCD-=dt;
  for(const st of G.stops.values()){if(st.cheer>0)st.cheer-=dt;if(st.missed>0)st.missed-=dt;if(st.prio>0)st.prio-=dt}
  for(const k in G.gaveBlock){G.gaveBlock[k]*=1-dt*.012;if(G.gaveBlock[k]<.05)delete G.gaveBlock[k]}
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.a+=dt/p.life;if(p.a>=1)G.parts.splice(i,1)}
  if(G.flashSat>0)G.flashSat-=dt*2;
  G.lmT-=dt;if(G.lmT<=0){G.lmT=2;landmarkTick();tickMissions()}
  if(!L.sandbox&&G.money<-800&&!G.over){gameOver('bankrupt');return}
  if(G.t>=DAY_LEN&&!G.over&&!G.dayEnding){G.dayEnding=true;endOfDay()}
}
function seasonFor(day){return SEASONS[(day-1+((G.L.daily||G.L.weekly)?((G.L.seed||0)%4):0))%4]}

function makeMissions(){
  const exp=Math.round(G.L.perDay*(1+.12*(G.day-1))*(G.season==='summer'?1.12:1)),lm=G.city.landmarks||{};
  const pool=[
   {id:'noon',text:'Deliver '+Math.round(exp*.2)+' riders before noon',goal:Math.round(exp*.2),prog:()=>G.mDel,byT:54,reward:300,xp:30},
   {id:'clear',text:'Clear 3 red stops',goal:3,prog:()=>G.mClears,reward:350,xp:35},
   {id:'pm',text:'Evening rush: nobody gives up',goal:1,special:'pm',reward:500,xp:50},
   {id:'fares',text:'Earn '+money(Math.round(exp*3.6))+' in fares today',goal:Math.round(exp*3.6),prog:()=>G.dayRev,reward:400,xp:40},
   {id:'happy',text:'Finish the day over 85% satisfied',goal:1,special:'happy',reward:450,xp:45}];
  if(lm.hosp)pool.push({id:'hosp',text:'Take 5 patients to the hospital',goal:5,prog:()=>G.mDest.hosp||0,reward:500,xp:50});
  if(lm.mall)pool.push({id:'mall',text:'Take 8 shoppers to the mall',goal:8,prog:()=>G.mDest.mall||0,reward:400,xp:40});
  if(lm.school)pool.push({id:'school',text:'Take 8 pupils to school',goal:8,prog:()=>G.mDest.school||0,reward:400,xp:40});
  if(lm.air)pool.push({id:'air',text:'Take 8 riders to the airport',goal:8,prog:()=>G.mDest.air||0,reward:450,xp:45});
  if(lm.uni)pool.push({id:'uni',text:'Take 10 students to the university',goal:10,prog:()=>G.mDest.uni||0,reward:400,xp:40});
  if(G.city.venue)pool.push({id:'arena',text:'Take 8 riders to the arena',goal:8,prog:()=>G.mDest.venue||0,reward:400,xp:40});
  const picks=[];while(picks.length<2&&pool.length){picks.push(pool.splice(Math.floor(rnd()*pool.length),1)[0])}
  G.missions=picks.map(m=>Object.assign({done:false,failed:false},m));G.mDel=0;G.mClears=0;G.mDest={};G.gaveMark=-1;ui.dirty=true;
}
function completeMission(m){
  m.done=true;G.money+=m.reward;addXp(m.xp);G.xpDay+=m.xp;snd('cheer');toast('Mission complete: '+m.text+'  +$'+m.reward+' · +'+m.xp+' XP',4200);ui.dirty=true;
}
function tickMissions(){
  if(!G.missions.length||tutOn())return;
  for(const m of G.missions){
    if(m.done||m.failed)continue;
    if(m.special==='pm'){
      if(G.t>=70&&G.gaveMark<0)G.gaveMark=G.dayGave;
      if(G.t>=110){if(G.gaveMark>=0&&G.dayGave===G.gaveMark)completeMission(m);else{m.failed=true;ui.dirty=true}}
    }else if(m.special==='happy'){}
    else if(m.prog()>=m.goal)completeMission(m);
    else if(m.byT&&G.t>m.byT){m.failed=true;ui.dirty=true}
  }
}
function finishMissions(){
  for(const m of G.missions){
    if(m.done||m.failed)continue;
    if(m.special==='happy'){const t=G.dayDel+G.dayGave;if(t&&G.dayDel/t>=.85)completeMission(m);else m.failed=true}
    else if(m.special==='pm'){if(G.gaveMark>=0&&G.dayGave===G.gaveMark)completeMission(m);else m.failed=true}
    else if(m.prog&&m.prog()>=m.goal)completeMission(m);else m.failed=true;
  }
}

function callPriority(id){

  if(G.prioCD>0){toast('Priority is recharging ('+Math.ceil(G.prioCD)+'s).');return}
  st.prio=has('dispatch')?18:12;G.prioCD=has('dispatch')?25:50;fx.ring(st.x,st.y,'#2a7de1',48);snd('alert');

function rivalTick(dt){
  const N=G.city.nodes;
  for(const rt of G.rival.routes){
    const p=rt.path;let move=52*dt,guard=0;
    while(move>0&&guard++<10){
      const a=N[p[rt.seg]],bi=rt.seg+rt.dir;
      if(bi<0||bi>=p.length){rt.dir=-rt.dir;continue}
      const b=N[p[bi]],len=Math.hypot(b.x-a.x,b.y-a.y),rem=len-rt.s;
      if(move<rem){rt.s+=move;move=0}else{move-=rem;rt.seg=bi;rt.s=0}
    }
    const a=N[p[rt.seg]],bi=clamp(rt.seg+rt.dir,0,p.length-1),b=N[p[bi]],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;
    rt.ang=Math.atan2(dy,dx);rt.x=a.x+dx/l*rt.s-dy/l*-5.5*-1;rt.y=a.y+dy/l*rt.s+dx/l*5.5*-1;
    rt.x=a.x+dx/l*rt.s+(-dy/l)*5.5;rt.y=a.y+dy/l*rt.s+(dx/l)*5.5;
  }
}
function rivalExpand(){
  const C=G.city,rv=G.rival,cap=2+G.day;if(rv.stops.length>=cap)return;
  if(has('rivalradar')&&rnd()<.5)return;
  let best=null;
  for(const n of C.nodes){
    if(!n.alive||n.adj.length<2||G.stops.has(n.id)||rv.stops.includes(n.id))continue;
    let near=false;
    for(const st of G.stops.values())if(Math.hypot(st.x-n.x,st.y-n.y)<130){near=true;break}
    if(near)continue;
    for(const id of rv.stops){const o=C.nodes[id];if(Math.hypot(o.x-n.x,o.y-n.y)<100){near=true;break}}
    if(near)continue;
    let sc=0;for(const h of C.homes)if(Math.hypot(h.x-n.x,h.y-n.y)<130)sc++;
    const bk=Math.floor((n.x-MARGIN)/S)+','+Math.floor((n.y-MARGIN)/S);sc+=(G.gaveBlock[bk]||0)*3+rnd()*2;
    if(!best||sc>best.sc)best={n,sc};
  }
  if(!best)return;
  rv.stops.push(best.n.id);
  if(rv.stops.length>=2&&rv.routes.length<3){
    const a=rv.stops[rv.stops.length-2],b=rv.stops[rv.stops.length-1],p=roadPath(a,b,false);
    if(p&&p.length>1)rv.routes.push({path:p,seg:0,s:0,dir:1,x:C.nodes[a].x,y:C.nodes[a].y,ang:0});
  }
  toast('Rival Transit opened a stop on '+nodeName(best.n)+'.');
}

/* ================= growth & save ================= */
function growCity(){
  const L=G.L,rows=L.map.length,cols=L.map[0].length,cand=[];
  const at=(c,r)=>(r>=0&&r<rows&&c>=0&&c<cols)?L.map[r][c]:'x';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(at(c,r)!=='.')continue;
    let nh=0,nb=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const t=at(c+dc,r+dr);if(t==='H')nh++;if(t==='B')nb++}
    if(nh+nb>0)cand.push({c,r,nh,nb});
  }
  if(!cand.length)return null;
  const picks=[],n=Math.min(2,cand.length);
  for(let k=0;k<n;k++){const i=Math.floor(rnd()*cand.length),p=cand.splice(i,1)[0];picks.push(p)}
  const grid=L.map.map(s=>s.split('')),names=[];
  for(const p of picks){const letter=(p.nb>p.nh&&rnd()<.6)||rnd()<.18?'B':'H';grid[p.r][p.c]=letter;names.push((letter==='H'?'homes':'offices')+' near '+HN[p.r]+' & '+ord(p.c+1))}
  L.map=grid.map(a=>a.join(''));
  G.city=buildCity(L);
  if(T.ok){build3D(G.city);resetDyn()}
  for(const r of G.routes)recalcRoute(r);
  netChanged();
  return names.join(' and ');
}

function nearestNode(sx,sy,maxScreen){
  if(!G.city)return null;
  const w=toWorld(sx,sy);if(!w)return null;
  let best=null,bd=Infinity;
  const lim=Math.min(55,maxScreen/cam.zoom);
  for(const n of G.city.nodes){if(!n.alive)continue;const d=Math.hypot(n.x-w.x,n.y-w.y);if(d<bd){bd=d;best=n}}
  return best&&bd<=Math.max(lim,34)?best:null;
}
function onTap(sx,sy){
  if(G.modal||!G.city)return;
  if(ui.shape){const n=nearestNode(sx,sy,60);if(n)shapeTap(n);return}
  if(ui.moving){const n=nearestNode(sx,sy,60);if(n){pushUndo();moveStop(ui.moving,n.id)}return}
  const tool=ui.tool;
  if(tool==='select'){
    const w=toWorld(sx,sy);if(!w)return;
    for(const b of G.buses){if(Math.hypot(b.x-w.x,b.y-w.y)<Math.max(22,24/cam.zoom)){ui.follow=b.id;cam.zoom=Math.max(cam.zoom,2);ui.dirty=true;return}}
    let best=null,bd=Math.max(30,30/cam.zoom);
    for(const st of G.stops.values()){const d=Math.hypot(st.x-w.x,st.y-w.y);if(d<bd){bd=d;best=st}}
    ui.sel=best?{type:'stop',id:best.id}:null;ui.dirty=true;return;
  }
  const n=nearestNode(sx,sy,60);if(!n)return;
  if(tool==='stop'||tool==='route')pushUndo();
  if(tool==='stop'){
    if(G.stops.has(n.id)){ui.sel={type:'stop',id:n.id};ui.dirty=true}
    else{if(!addStop(n.id))return;ui.sel={type:'stop',id:n.id};fx.ring(n.x,n.y,'#2a7de1',34);snd('pop');netChanged()}
    return;
  }
  if(tool==='route')routeTap(n);
}
function routeTap(n){
  const L=G.L,d=ui.drawing,st=G.stops.get(n.id);
  const owner=st?routesAt(n.id):[];
  if(!d){
    if(!st){if(!addStop(n.id))return;ui.drawing={routeId:null,first:n.id};fx.ring(n.x,n.y,'#2a7de1',34);snd('pop');ui.dirty=true;return}
    if(owner.length===1&&owner[0].stops[owner[0].stops.length-1]===n.id){ui.drawing={routeId:owner[0].id};ui.sel={type:'route',id:owner[0].id};toast('Extending '+owner[0].name+'. Tap the next stop.');ui.dirty=true;return}
    if(owner.length&&!L.transfer){toast('That stop is on '+owner[0].name+'. Transfer stops unlock in level 3.');return}
    ui.drawing={routeId:null,first:n.id};ui.dirty=true;return;
  }
  if(d.routeId===null){
    if(n.id===d.first){ui.drawing=null;toast('Route cancelled.');ui.dirty=true;return}
    if(owner.length&&!L.transfer){toast('That stop is on '+owner[0].name+'. Transfer stops unlock in level 3.');return}
    if(G.routes.length>=8){toast('Maximum of 8 routes.');return}
    if(!st&&!addStop(n.id))return;
    const r=newRoute([d.first,n.id]);
    const ok=addBus(r);if(!ok)toast(r.name+' has no bus yet. Add one in the Buses panel when you have cash.');
    ui.drawing={routeId:r.id};ui.sel={type:'route',id:r.id};toast(r.name+' is running. Keep tapping stops to extend it.');fx.ring(n.x,n.y,r.color,34);snd('pop');netChanged();return;
  }
  const r=G.routes.find(x=>x.id===d.routeId);
  if(!r){ui.drawing=null;ui.dirty=true;return}
  if(st&&r.stops.includes(n.id)){
    if(r.stops[r.stops.length-1]===n.id){finishDrawing();return}
    toast('That stop is already on '+r.name+'.');return;
  }
  if(st&&owner.length&&!L.transfer){toast('That stop is on '+owner[0].name+'. Transfer stops unlock in level 3.');return}
  if(!st&&!addStop(n.id))return;

}

      g.fillStyle='#ffd25c';g.font='800 64px Outfit,Arial,sans-serif';g.fillText('★'.repeat(st)+'☆'.repeat(Math.max(0,3-st)),48,990);

    };
    const gr=g.createLinearGradient(0,0,0,H2);gr.addColorStop(0,'#16314a');gr.addColorStop(1,'#0e1b2a');g.fillStyle=gr;g.fillRect(0,0,W2,H2);
    if(url){const img=new Image();img.onload=()=>{const r=Math.max(W2/img.width,600/img.height),w=img.width*r,h=img.height*r;g.save();rrect(g,0,0,W2,600,0);g.clip();g.drawImage(img,(W2-w)/2,(600-h)/2,w,h);g.restore();const sh=g.createLinearGradient(0,420,0,600);sh.addColorStop(0,'rgba(14,27,42,0)');sh.addColorStop(1,'rgba(14,27,42,1)');g.fillStyle=sh;g.fillRect(0,420,W2,181);done()};img.onerror=done;img.src=url}else done();
  };
}

/* ================= main loop ================= */
let last=performance.now(),uiT=0;
function frame(now){
  const rdt=Math.min(.1,(now-last)/1000);last=now;
  if(G.city){
    if(!G.paused&&!G.modal&&!G.over){
      let dt=rdt*G.speed;
      while(dt>0&&!G.modal&&!G.over){const s=Math.min(.05,dt);stepAll(s);dt-=s}
    }
    uiT+=rdt;
    if(ui.dirty)refreshUI();
    if(uiT>.25){uiT=0;ui.vibrate=true;coachTick();hud();updateStopCard(false);liveInfo();const h=hintText(),hn=$('#hint');if(hn.textContent!==h){hn.hidden=!h;hn.textContent=h}}
    if(ui.follow){const fb=G.buses.find(x=>x.id===ui.follow);if(!fb){ui.follow=null;ui.dirty=true}else{const k=Math.min(1,rdt*5);cam.x+=(fb.x-cam.x)*k;cam.y+=(fb.y-cam.y)*k;clampCam()}}
    if(ui.photo)cam.yaw+=rdt*.1;
    if(uiT===0)audioUpdate();
    render3D(now,(!G.paused&&!G.modal&&!G.over)?rdt*G.speed:0,rdt);
  }
  requestAnimationFrame(frame);
}
function stepAll(dt){concertTick(dt);step(dt)}
