<title>Rush Hour Routes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen map canvas, glass HUD on top, big thumb-friendly toolbar at the bottom. */
:root{
  --grass:#93c96f; --deep:#1d3b2f; --ink:#1b2733; --muted:#5d6b78; --panel:rgba(255,255,255,.95); --line:#d7e0e6;
  --accent:#2a7de1; --accent-soft:#e4effd; --ok:#3fb868; --warn:#f2b632; --bad:#e2483d; --night:#2b3a67;
  --font-display:'Outfit','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#6fae55;color:var(--ink);font-family:var(--font-body);font-size:14px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.pick{cursor:crosshair}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(18,45,30,.22)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(8,16,24,.32) 100%)}
#top{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
#row1{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;pointer-events:none}
#row1>*{pointer-events:auto}
#satCard{flex:1 1 230px;padding:8px 14px;min-width:0}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.satline{display:flex;align-items:center;gap:12px}
#satPct{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1.05;min-width:76px;font-variant-numeric:tabular-nums}
#satBar{position:relative;flex:1;height:12px;border-radius:8px;background:#e6edf1;overflow:hidden}
#satFill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:8px;background:var(--ok);transition:width .4s,background .4s}
#satMark{position:absolute;left:50%;top:-2px;bottom:-2px;width:3px;background:var(--ink);opacity:.55}
.counts{font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap}
.counts i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#satCard.warn #satPct{color:var(--bad);animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.55}}
#clockCard{flex:1 1 200px;padding:8px 14px;min-width:0}
.clockline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#clock{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
#dayLbl{font-weight:800;font-size:13px;color:var(--muted)}
#phasePill{font-weight:800;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
#phasePill.rush{background:var(--accent);color:#fff}
#tl{position:relative;display:flex;height:8px;border-radius:6px;overflow:hidden;margin-top:6px;background:#e6edf1}
#tl i{display:block;height:100%}
#tlMark{position:absolute;top:-2px;bottom:-2px;width:4px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
#ctrl{display:flex;gap:6px;padding:6px;align-items:center}
.cbtn{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:16px;padding:0}
.cbtn:active{transform:scale(.95)}
.cbtn:disabled{opacity:.35}
.cbtn svg{width:24px;height:24px}
#bPlay{background:var(--ok);color:#fff;border-color:transparent;width:60px}
#bPlay.paused.ready{animation:ready 1s infinite alternate}
@keyframes ready{to{box-shadow:0 0 0 8px rgba(63,184,104,.28)}}
#banner{padding:8px 14px;font-weight:700;display:flex;gap:10px;align-items:center;border-left:6px solid var(--warn)}
#banner.concert{border-left-color:#8a5cf6}
#banner b{font-family:var(--font-display)}
#banner span.t{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
#hint{align-self:center;max-width:100%;padding:7px 14px;border-radius:99px;background:rgba(27,39,51,.82);color:#fff;font-weight:700;font-size:13px;text-align:center;pointer-events:none}
.toast{align-self:center;padding:8px 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;pointer-events:none;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#bottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#bottom>*{pointer-events:auto;max-width:100%}
#toolbar{display:flex;gap:6px;padding:6px}
.tbtn{position:relative;width:78px;height:62px;border-radius:14px;border:2px solid transparent;background:#f1f5f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:12px;padding:0}
.tbtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tbtn.on{background:var(--accent);color:#fff}
.tbtn:active{transform:scale(.96)}
.tbtn .badge{position:absolute;top:-6px;right:-4px;background:var(--ink);color:#fff;border-radius:99px;font-size:11px;padding:2px 7px;font-variant-numeric:tabular-nums}
#sheet{width:min(600px,100%);max-height:min(34vh,calc(100vh - 250px));overflow:auto;padding:8px 8px 16px;scroll-padding-bottom:16px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.rrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;border-radius:12px;border:2px solid var(--line);background:#fff}
.rrow.sel{border-color:var(--accent);background:var(--accent-soft)}
.rrow:not(.sel) .mini{display:none}
.sw{width:14px;height:34px;border-radius:7px;flex:none}
.rinfo{flex:1 1 120px;min-width:0;display:flex;flex-direction:column}
.rinfo b{font-family:var(--font-display);font-size:15px}
.rinfo b em{font-style:normal;font-size:11px;background:#fff3c9;color:#8a6200;border-radius:6px;padding:1px 6px;margin-left:4px}
.rinfo small{color:var(--muted);font-weight:600}
.rinfo small.bad{color:var(--bad);font-weight:800}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:#f1f5f8;font-size:24px;font-weight:800;line-height:1;padding:0}
.stepper .bn{min-width:26px;text-align:center;font-family:var(--font-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.mini{height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#f1f5f8;font-weight:800;font-size:13px}
.mini.on{background:#ffe9a8;border-color:#e6b93a}
.mini.danger{color:var(--bad)}
.mini.locked{opacity:.55}
.mini:disabled{opacity:.45}
.empty{padding:10px;color:var(--muted);font-weight:600;text-align:center}
#coach{display:flex;gap:10px;align-items:center;padding:10px 12px;width:min(560px,100%);box-sizing:border-box;border:2px solid #8a5cf6;font-weight:700;font-size:13px;line-height:1.35}
#coach span{flex:1}
#coach button{height:44px;padding:0 16px;border-radius:12px;border:0;background:#8a5cf6;color:#fff;font-weight:800}
#drawbar{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border:2px solid var(--accent)}
#drawbar .txt{font-weight:800;margin-right:4px}
#drawbar button{height:50px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#f1f5f8;font-weight:800;font-size:14px}
#drawbar button.go{background:var(--ok);color:#fff;border-color:transparent}
#stopcard{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;width:min(520px,100%);box-sizing:border-box}
#stopcard .si{flex:1 1 200px;display:flex;flex-direction:column}
#stopcard .si b{font-family:var(--font-display);font-size:15px}
#stopcard .si span{color:var(--muted);font-weight:600;font-size:13px}
#stopcard button{height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#f1f5f8;font-weight:800}
#stopcard button.danger{color:var(--bad)}
#ov{position:absolute;inset:0;background:rgba(18,40,32,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;z-index:10}
.card{width:min(760px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-sizing:border-box;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card.small{width:min(440px,100%);text-align:center}
.card h1{font-family:var(--font-display);font-weight:800;font-size:34px;margin:0;line-height:1.05;text-wrap:balance}
.card h2{font-family:var(--font-display);font-weight:800;font-size:26px;margin:0 0 6px;text-wrap:balance}
.card p{margin:6px 0;line-height:1.45;color:#34424f}
.sub{color:var(--muted);font-weight:600;margin-top:6px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:16px 0}
.how div{background:#f2f7f4;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4}
.how b{display:block;font-family:var(--font-display);font-size:15px;margin-bottom:2px}
.how .dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lv{border:2px solid var(--line);border-radius:16px;background:#fff;padding:14px;text-align:left;min-height:120px;display:flex;flex-direction:column;gap:4px}
.lv:hover,.lv:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
.lv b{font-family:var(--font-display);font-size:18px}
.lv small{color:var(--muted);font-weight:600;line-height:1.35}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.chip{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:#e6edf1}
.chip.new{background:#ffe9a8;color:#7a5600}
.stars{font-size:20px;letter-spacing:2px;color:#d3a21d}
.stars .off{color:#d6dde2}
.card>.btnrow:last-child{position:sticky;bottom:-22px;background:linear-gradient(rgba(255,255,255,0),#fff 28%);padding:14px 0 4px;margin-top:10px}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{height:54px;padding:0 24px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-family:var(--font-display);font-weight:800;font-size:17px}
.btn.alt{background:#e9eff3;color:var(--ink)}
.btn.ok{background:var(--ok)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.statgrid div{background:#f2f7f4;border-radius:12px;padding:10px}
.statgrid b{display:block;font-family:var(--font-display);font-size:26px;font-variant-numeric:tabular-nums}
.statgrid span{font-size:12px;font-weight:700;color:var(--muted)}
#photoX{position:absolute;right:14px;bottom:14px;z-index:5;height:48px;padding:0 18px;border-radius:14px;border:0;background:rgba(20,30,40,.7);color:#fff;font-weight:800}
.photo #top,.photo #bottom,.photo #vig{display:none}
.cash{margin-left:auto;font-family:var(--font-display);font-weight:800;color:var(--ink);font-size:14px}
.cash.neg{color:var(--bad)}
.shead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:2px 4px}
.shead b{font-family:var(--font-display);font-size:15px;margin-right:auto}
.rtools{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:6px}
.rtools .rname{flex:1 1 140px;height:44px;border-radius:12px;border:1px solid var(--line);padding:0 12px;font:700 14px var(--font-body);min-width:0;user-select:text;-webkit-user-select:text}
.mini.on{background:#d9f3e2;border-color:#7fcf9c}
.sw{border:0;padding:0;cursor:pointer;width:18px}
.badges em{font-style:normal;font-size:10px;background:#e6edf1;color:#4b5a68;border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:800}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:4px 8px}
.tbl td{text-align:right;padding:6px 8px;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.neg{color:var(--bad)}
.worst{background:#fff4d6;border-radius:12px;padding:10px 14px;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;line-height:1.35}
.worst b{width:100%;font-family:var(--font-display)}
.goals{list-style:none;padding:0;margin:12px 0;display:flex;flex-direction:column;gap:6px}
.goals li{display:flex;align-items:center;gap:10px;background:#f2f7f4;border-radius:12px;padding:10px 14px;font-weight:700}
.goals li span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--muted);font-size:13px}
.goals li.ok span{background:var(--ok)}.goals li.no span{background:var(--bad)}
.goals li em{margin-left:auto;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
#missions{padding:7px 12px;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;gap:3px}
#missions .m{display:flex;gap:8px;align-items:center}
#missions .m b{font-weight:800;color:var(--accent)}
#missions .m.done{color:var(--ok);text-decoration:line-through;opacity:.8}
#missions .m.fail{color:var(--muted);text-decoration:line-through;opacity:.7}
#missions .m em{margin-left:auto;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
#missions .goal u{text-decoration:none;font-weight:800}#missions .goal u.bad{color:var(--bad)}#missions .goal u.ok{color:var(--ok)}
#missions .mayor b{color:#b8860b}#missions .mayor span{font-weight:800}
#missions .rv{color:#c26a12}
.lvlrow{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;font-weight:800;color:var(--muted)}
#xpBar{flex:1;height:5px;border-radius:4px;background:#e6edf1;overflow:hidden}
#xpFill{display:block;height:100%;background:#8a5cf6;width:0}
.hallgrid{display:grid;gap:8px;margin:12px 0}
.hallrow{display:flex;gap:10px;align-items:center;background:#f2f7f4;border-radius:12px;padding:10px 12px}
.hallrow div{flex:1;min-width:0}.hallrow b{font-family:var(--font-display)}.hallrow small{display:block;color:var(--muted);font-weight:600;line-height:1.3}
.hallrow.owned{background:#e1f5e8}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sw2{min-width:52px;height:52px;border-radius:12px;border:3px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;padding:0 8px;background:#fff}
.sw2.on{border-color:var(--accent)}.sw2:disabled{opacity:.45}
.sharecard{width:100%;border-radius:14px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.25);-webkit-user-select:auto;user-select:auto}
.menugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.menugrid .btn{height:50px;font-size:15px;padding:0 10px}
.menugrid .full{grid-column:1/-1}
@media (max-width:560px){
  .tbtn{width:60px!important;font-size:11px}
  #bSound,#bFit{display:none}
  #satCard{flex:1 1 150px;padding:6px 12px}
  #clockCard{flex:1 1 120px;padding:6px 10px;order:2}
  #clock{font-size:21px}#dayLbl{font-size:11px}
  .set{flex-wrap:wrap}.set .seg{justify-content:flex-start;width:100%}
  #ctrl{order:1}
  .satline{gap:8px}
  #top,#bottom{left:8px;right:8px}
  #top{top:8px}#bottom{bottom:8px}
  #satPct{font-size:28px;min-width:64px}
  #clock{font-size:24px}
  .cbtn{width:40px;height:40px;border-radius:12px}#bPlay{width:48px}
  .lvlrow{display:none}
  #clockCard .clockline{gap:6px}#clockCard{padding:5px 10px}
  #phasePill{font-size:11px;padding:2px 8px}
  .tbtn{width:70px;height:60px}
  .card{padding:16px}.card h1{font-size:28px}
  .how{grid-template-columns:repeat(2,1fr);gap:8px}.how div{font-size:12.5px;padding:10px}.how b{font-size:14px}
  #sheet{max-height:34vh}
  #ctrl{padding:5px;gap:4px}
}

#tour{position:absolute;inset:0;z-index:30}#tour .tspot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(10,20,30,.58);border:3px solid #fff;pointer-events:none;animation:pulse .9s infinite alternate}
#tour .tcard{position:fixed;left:50%;transform:translateX(-50%);width:min(380px,calc(100% - 24px));background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.4);box-sizing:border-box}
#tour .tcard b{font-family:var(--font-display);font-size:17px}#tour .tcard p{margin:6px 0 10px;line-height:1.45}
#tour .tbtns{display:flex;gap:8px;align-items:center}#tour .tbtns span{margin-right:auto;color:var(--muted);font-weight:700;font-size:12px}
#tour .tbtns button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:800}#tour .tbtns button.go{background:var(--ok);border-color:var(--ok);color:#fff}
.rtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.rtop button{border:0;background:#e6edf1;border-radius:8px;width:28px;height:28px;font-weight:800}
#replay{position:absolute;left:50%;transform:translateX(-50%);top:150px;width:min(450px,calc(100% - 20px));padding:10px 12px;box-sizing:border-box;z-index:6}#replay canvas{width:100%;height:auto;display:block;border-radius:10px}#replay small{display:block;color:var(--muted);font-weight:600;margin-top:4px}
.pin{border:0;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:11px;border-radius:8px;padding:2px 7px;margin-left:4px}
.legend{position:absolute;left:10px;bottom:92px;max-width:250px;padding:9px 12px;font-size:12.5px;font-weight:700;line-height:1.4;pointer-events:none}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (max-width:560px){.legend{left:8px;bottom:84px;max-width:210px;font-size:12px}}

.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px;position:sticky;top:-22px;background:#fff;padding:8px 0;z-index:2}
.gtabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.gtabs button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.gbody{text-align:left;font-size:14px;line-height:1.5}
.gbody h3{font-family:var(--font-display);margin:16px 0 4px;font-size:17px}
.gbody p{margin:4px 0}.gbody ul{margin:4px 0;padding-left:20px}.gbody li{margin:3px 0}
.gbody dl{margin:6px 0}.gbody dt{font-weight:800;margin-top:8px}.gbody dd{margin:0 0 0 0;color:#33424f}
.gbody .tip{background:var(--accent-soft);border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:600}
.bk{width:100%;height:78px;box-sizing:border-box;font:11px monospace;border:2px solid var(--line);border-radius:10px;padding:6px;-webkit-user-select:text;user-select:text;resize:none}
.set{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);text-align:left}
.set b{font-family:var(--font-display);font-size:15px}.set small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.set:has(.seg.wide){flex-wrap:wrap}.seg.wide{width:100%;justify-content:flex-start}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-weight:800;font-size:13px;min-height:38px}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tro{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
.tro i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e6edf1;color:var(--muted);font-weight:800;flex:none}
.tro.got i{background:var(--ok);color:#fff}.tro.lock{opacity:.6}
.tro b{font-family:var(--font-display)}.tro small{display:block;color:var(--muted);font-weight:600}
.slotc{border:2px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;text-align:left}
.slotc.cur{border-color:var(--ok)}
.quote{font-style:italic;color:var(--ink);line-height:1.5;margin:10px 0}
body.big #top,body.big #bottom,body.big #ov .card{zoom:1.1}
body.rm *{animation:none!important;transition:none!important}
#missions:not(.open) .m:nth-child(n+2):not(.goal){display:none}#missions{cursor:pointer}#missions:not(.open):has(.m:nth-child(2))::after{content:'Click or tap to see all missions';font-size:11px;color:var(--muted);font-weight:700}
@media (max-width:560px){#missions:not(.open)::after{content:"Tap for all missions";font-size:11px;color:var(--muted);font-weight:700}body.big #top,body.big #bottom,body.big #ov .card{zoom:1.1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <canvas id="cv" aria-label="City map"></canvas>

  <div id="vig"></div>
  <div id="top">
    <div id="row1">
      <div class="panel" id="satCard">
        <div class="lbl" title="Share of the last 50 riders who reached their destination">Satisfaction · last 50 riders</div>
        <div class="satline"><span id="satPct">100%</span><div id="satBar"><i id="satFill"></i><b id="satMark"></b></div></div>
        <div class="counts" title="Totals for this level so far"><span><i style="background:var(--ok)"></i><span id="cDel">0</span> delivered</span><span><i style="background:var(--bad)"></i><span id="cGave">0</span> gave up</span><span class="cash" id="cCash">$0</span></div>
        <div class="lvlrow"><span id="cLvl">Lv 1</span><div id="xpBar"><i id="xpFill"></i></div></div>
      </div>
      <div class="panel" id="clockCard">
        <div class="clockline"><span id="clock">06:00</span><span id="dayLbl">Day 1/3</span><span id="phasePill">Quiet morning</span></div>
        <div id="tl"><span id="tlMark"></span></div>
      </div>
      <div class="panel" id="ctrl">
        <button class="cbtn paused ready" id="bPlay" data-act="play" aria-label="Play or pause"></button>
        <button class="cbtn" id="bSpeed" data-act="speed" aria-label="Speed">1×</button>
        <button class="cbtn" id="bSound" data-act="sound" aria-label="Sound"></button>
        <button class="cbtn" id="bUndo" data-act="undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12"/></svg></button>
        <button class="cbtn" id="bFit" data-act="fit" aria-label="Fit map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="cbtn" id="bMenu" data-act="menu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </div>
    <div class="panel" id="banner" hidden></div>
    <div class="panel" id="missions" hidden></div>
    <div id="hint" hidden></div>
    <div id="toasts" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>

  <div id="bottom">
    <div class="panel" id="coach" hidden></div>
    <div class="panel" id="stopcard" hidden></div>
    <div class="panel" id="drawbar" hidden></div>
    <div class="panel" id="sheet" hidden></div>
    <div class="panel" id="toolbar">
      <button class="tbtn on" data-act="tool" data-tool="select"><svg viewBox="0 0 24 24"><path d="M6 3l12 8-5.5 1.5L10 18z"/></svg>Select</button>
      <button class="tbtn" data-act="tool" data-tool="stop"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5.5"/><path d="M12 14.5V22"/></svg>Stops</button>
      <button class="tbtn" data-act="tool" data-tool="route"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2.6"/><circle cx="19" cy="6" r="2.6"/><path d="M7 17c7 0 1-10 10-10.5"/></svg>Route</button>
      <button class="tbtn" data-act="sheet"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>Buses<span class="badge" id="fleetBadge" title="Buses in your fleet">0</span></button>
      <button class="tbtn" data-act="view" id="bView"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="viewLbl">Map view</span></button>
    </div>
  </div>

  <button id="photoX" hidden data-act="photox">Exit photo mode</button>
  <div id="ov" hidden></div>
</div>

function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

const WALLS=['#e9dfcc','#d9c7ad','#cdd4c0','#c9d3de','#e5d0cc','#d8d2c4'];
const ROOFS=['#8a4b3a','#6d4a3d','#4d535c','#5b3f33','#7a5a45','#3f464f'];
const APTS=['#e9d5b8','#d6c4e3','#c9dcd0','#f0cfc4'];
const GLASS=['#a4c8e8','#b8d4ea','#8fb6dc','#a9cfe4','#c2d8ea'];

function buildCity(L){
  const rows=L.map.length, cols=L.map[0].length, R=rng(L.seed);
  const nodes=[];
  for(let r=0;r<=rows;r++)for(let c=0;c<=cols;c++)nodes.push({id:r*(cols+1)+c,c,r,x:MARGIN+c*S,y:MARGIN+r*S,adj:[],alive:false});
  const blk=(c,r)=>(r>=0&&r<rows&&c>=0&&c<cols)?L.map[r][c]:'.';
  const cls=ch=>ch==='W'?'W':(ch==='P'||ch==='C')?'P':'';
  const id=(c,r)=>r*(cols+1)+c;
  const edges=[],edgeMap=new Map();
  function addEdge(a,b,name){const e={id:edges.length,a,b,len:S,closed:false,name};edges.push(e);nodes[a].adj.push({to:b,e});nodes[b].adj.push({to:a,e});edgeMap.set(a*4096+b,e);edgeMap.set(b*4096+a,e)}
  for(let r=0;r<=rows;r++)for(let c=0;c<=cols;c++){
    if(c<cols){const A=cls(blk(c,r-1)),B=cls(blk(c,r));if(!(A&&A===B))addEdge(id(c,r),id(c+1,r),HN[r]+' Street')}
    if(r<rows){const A=cls(blk(c-1,r)),B=cls(blk(c,r));if(!(A&&A===B))addEdge(id(c,r),id(c,r+1),ord(c+1)+' Avenue')}
  }
  for(const n of nodes)n.alive=n.adj.length>0;
  const blocks=[],items=[],homes=[],works=[],landmarks={};let venue=null;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const t=L.map[r][c],bx=MARGIN+c*S,by=MARGIN+r*S,R=rng(L.seed*977+r*131+c*7+1);
    blocks.push({c,r,x:bx,y:by,t});
    const slot=(i,j)=>[bx+16+17+34*i+(R()-.5)*3,by+16+17+34*j+(R()-.5)*3];
    if(t==='H'){
      const all=[[0,0],[1,0],[0,1],[1,1]];let use=all.filter(()=>R()<.85);if(use.length<3)use=all.slice(0,3);
      const apt=R()<.3?Math.floor(R()*use.length):-1;
      use.forEach((s,k)=>{const[x,y]=slot(s[0],s[1]);
        const b=k===apt?{type:'home',kind:'apt',x,y,w:27,d:26,h:22+R()*8,col:pick(R,APTS)}:{type:'home',kind:'house',x,y,w:21+R()*5,d:17+R()*4,h:9+R()*4,col:pick(R,WALLS),roof:pick(R,ROOFS)};
        items.push({k:'b',y:y+b.d/2,b});homes.push(b);if(k===apt)homes.push(b)});
      if(R()<.6)items.push({k:'t',y:by+50,x:bx+50,s:.8,v:R()<.5});
    }else if(t==='B'){
      const all=[[0,0],[1,0],[0,1],[1,1]];let use=all.filter(()=>R()<.8);if(use.length<3)use=all.slice(0,3);
      for(const s of use){const[x,y]=slot(s[0],s[1]);const b={type:'work',x,y,w:25,d:25,h:20+R()*26,col:pick(R,GLASS)};items.push({k:'b',y:y+b.d/2,b});works.push(b)}
    }else if(LMK[t]){
      const D=LMK[t],b={type:'landmark',kind:D.kind,x:bx+50,y:by+D.y,w:D.w,d:D.d,h:D.h};
      landmarks[b.kind]=b;items.push({k:'b',y:b.y+b.d/2,b});
      if(t==='U'||t==='K'||t==='O')for(let k=0;k<4;k++)items.push({k:'t',y:by+78+R()*10,x:bx+16+k*22,s:.7,v:R()<.5});
    }else if(t==='C'){
      venue={type:'venue',x:bx+50,y:by+52,w:62,d:46,h:12};items.push({k:'b',y:venue.y+venue.d/2,b:venue});
      for(let k=0;k<4;k++)items.push({k:'t',y:by+22+R()*60,x:bx+(k%2?86:14)+(R()-.5)*6,s:.8,v:R()<.5});
    }else if(t==='P'){
      for(let k=0;k<7;k++)items.push({k:'t',y:by+14+R()*72,x:bx+14+R()*72,s:.7+R()*.5,v:R()<.5});
    }else if(t==='.'){
      for(let k=0;k<3;k++)items.push({k:'t',y:by+18+R()*64,x:bx+18+R()*64,s:.7+R()*.4,v:R()<.5});
    }
  }
  items.sort((a,b)=>a.y-b.y);
  // connectivity check
  const alive=nodes.filter(n=>n.alive),seen=new Set([alive[0].id]),q=[alive[0].id];
  while(q.length){const n=nodes[q.pop()];for(const a of n.adj)if(!seen.has(a.to)){seen.add(a.to);q.push(a.to)}}
  const connected=seen.size===alive.length;
  const city={L,nodes,edges,edgeMap,blocks,items,homes,works,venue,landmarks,cols,rows,w:MARGIN*2+cols*S,h:MARGIN*2+rows*S,seed:L.seed,connected};
  city.img=renderStatic(city);
  return city;
}

function mkCanvas(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c}
function noiseTile(R,size,base,amt,alpha){
  return mkCanvas(size,size,(g,w,h)=>{
    const id=g.createImageData(w,h);
    for(let i=0;i<w*h;i++){const v=base+(R()-.5)*amt;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=alpha}
    g.putImageData(id,0,0);
  });
}
function renderStatic(city){
  const sc=Math.min(2.6,3600/city.w,3200/city.h),cv=document.createElement('canvas');
  cv.width=Math.ceil(city.w*sc);cv.height=Math.ceil(city.h*sc);
  const g=cv.getContext('2d');g.scale(sc,sc);
  const R=rng(city.seed*7+3),map=city.L.map,rows=city.rows,cols=city.cols;
  const bt=(c,r)=>(r>=0&&r<rows&&c>=0&&c<cols)?map[r][c]:'.';
  const grain=noiseTile(R,128,128,255,255);
  const grainFill=g.createPattern(grain,'repeat');
  function grainOver(x,y,w,h,a){g.save();g.globalCompositeOperation='overlay';g.globalAlpha=a;g.fillStyle=grainFill;g.fillRect(x,y,w,h);g.restore()}
  function blotches(x,y,w,h,cols_,n,rmin,rmax,a){
    for(let i=0;i<n;i++){
      const bx=x+R()*w,by=y+R()*h,r=rmin+R()*(rmax-rmin),c=cols_[Math.floor(R()*cols_.length)];
      const gr=g.createRadialGradient(bx,by,0,bx,by,r);gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');
      g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.globalAlpha=a;g.fillStyle=gr;g.fillRect(bx-r,by-r,r*2,r*2);g.restore();
    }
  }
  function blades(x,y,w,h,n,cl){
    g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.lineWidth=.6;
    for(let i=0;i<n;i++){const bx=x+R()*w,by=y+R()*h;g.strokeStyle=cl[Math.floor(R()*cl.length)];g.globalAlpha=.35+R()*.4;g.beginPath();g.moveTo(bx,by);g.lineTo(bx+(R()-.5)*1.6,by-1.6-R()*2.2);g.stroke()}
    g.restore();
  }
  // ground
  g.fillStyle='#6b974b';g.fillRect(0,0,city.w,city.h);
  blotches(0,0,city.w,city.h,['#82ad5a','#587f3d','#8fb566','#6a8f45'],Math.round(city.w*city.h/9000),50,140,.35);
  blades(0,0,city.w,city.h,Math.round(city.w*city.h/9),['#4d7433','#86b25d','#9bbd6e','#5b8740']);
  grainOver(0,0,city.w,city.h,.5);
  // blocks
  for(const b of city.blocks){
    const x=b.x,y=b.y;
    if(b.t==='H'){
      g.fillStyle='#78a553';g.fillRect(x+10,y+10,S-20,S-20);
      blotches(x,y,S,S,['#8db764','#628a45'],5,15,40,.4);
      blades(x+10,y+10,S-20,S-20,500,['#4d7433','#9bc26a','#86b25d']);
      g.strokeStyle='#4c7a37';g.lineWidth=2;g.strokeRect(x+14.5,y+14.5,S-29,S-29); // hedge
      g.strokeStyle='rgba(30,60,25,.35)';g.lineWidth=1;g.strokeRect(x+16,y+16,S-32,S-32);
    }else if(b.t==='B'||LMK[b.t]){
      g.fillStyle='#b9bec3';g.fillRect(x+6,y+6,S-12,S-12);
      g.strokeStyle='rgba(90,98,106,.55)';g.lineWidth=.5;
      for(let k=6;k<=S-6;k+=8){g.beginPath();g.moveTo(x+k,y+6);g.lineTo(x+k,y+S-6);g.moveTo(x+6,y+k);g.lineTo(x+S-6,y+k);g.stroke()}
      g.fillStyle='#5f8f47';for(const[px,py]of[[10,10],[S-22,10],[10,S-22],[S-22,S-22]])g.fillRect(x+px,y+py,12,12);
      grainOver(x,y,S,S,.35);
    }else if(b.t==='P'||b.t==='C'){
      g.fillStyle='#5e9446';g.fillRect(x,y,S,S);
      blotches(x,y,S,S,['#74a955','#4d8038','#86b566'],8,15,45,.45);
      blades(x,y,S,S,900,['#3f6b2c','#8fc063','#6fa24a']);
      if(b.t==='P'){
        g.strokeStyle='#d6c9a4';g.lineWidth=3.6;g.lineCap='round';g.beginPath();g.moveTo(x+4,y+30+R()*40);g.bezierCurveTo(x+30,y+10,x+60,y+90,x+S-4,y+30+R()*40);g.stroke();
        g.strokeStyle='rgba(120,105,70,.5)';g.lineWidth=.8;g.stroke();
        for(let k=0;k<26;k++){g.fillStyle=['#f4e04d','#f28fb3','#fff','#c68be8'][k%4];g.beginPath();g.arc(x+8+R()*84,y+8+R()*84,.9,0,6.3);g.fill()}
      }
    }else if(b.t==='W'){
      const sides=[[0,-1],[0,1],[-1,0],[1,0]];
      g.fillStyle='#1d5b73';g.fillRect(x,y,S,S);
      g.fillStyle='#a3a49c';
      const c=b.c,r=b.r;
      if(bt(c,r-1)!=='W')g.fillRect(x,y,S,5);
      if(bt(c,r+1)!=='W')g.fillRect(x,y+S-5,S,5);
      if(bt(c-1,r)!=='W')g.fillRect(x,y,5,S);
      if(bt(c+1,r)!=='W')g.fillRect(x+S-5,y,5,S);
    }else{
      g.fillStyle='#6f9a4d';g.fillRect(x,y,S,S);
      g.fillStyle='rgba(133,112,76,.5)';g.beginPath();g.ellipse(x+30+R()*40,y+30+R()*40,16+R()*18,10+R()*12,R()*3,0,6.3);g.fill();
      blades(x,y,S,S,500,['#4d7433','#a6a06a','#86b25d']);
    }
  }
  // driveways & pads for houses, parking beside arena
  for(const it of city.items){
    if(it.k!=='b')continue;const b=it.b;
    if(b.type==='home'){
      const by=MARGIN+Math.floor((b.y-MARGIN)/S)*S;
      g.fillStyle='#b5b3aa';g.fillRect(b.x-2.2,b.y+b.d/2,4.4,Math.max(3,by+S-14-(b.y+b.d/2)));
      g.fillStyle='#8c8a84';g.fillRect(b.x-b.w/2-6,b.y+b.d/2-3,5,10);
    }else if(b.type==='venue'){
      const bx=MARGIN+Math.floor((b.x-MARGIN)/S)*S,by=MARGIN+Math.floor((b.y-MARGIN)/S)*S;
      g.fillStyle='#4a4f55';g.fillRect(bx+6,by+S-26,S-12,20);
      g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=.7;for(let k=10;k<S-8;k+=6){g.beginPath();g.moveTo(bx+k,by+S-26);g.lineTo(bx+k,by+S-14);g.stroke()}
    }
  }

  g.save();

}

let AC=null;const lastSnd={};
function tone(f,d,type,vol,when,slide){
  if(!ui.sound||!AC)return;
  try{const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
function snd(k){
  const n=performance.now();if(lastSnd[k]&&n-lastSnd[k]<90)return;lastSnd[k]=n;
  if(k==='pop')tone(520+rnd()*120,.07,'sine',.04);
  else if(k==='cheer'){tone(523,.14,'triangle',.07);tone(659,.14,'triangle',.07,.08);tone(784,.22,'triangle',.07,.16)}
  else if(k==='sad')tone(220,.25,'sawtooth',.03,0,140);
  else if(k==='alert'){tone(660,.16,'square',.04);tone(440,.24,'square',.04,.18)}
  else if(k==='deliver')tone(880,.08,'sine',.03);
  else if(k==='bell'){tone(1175,.1,'sine',.03);tone(880,.16,'sine',.025,.09)}
  else if(k==='hiss'){airBrake()}
  else if(k==='alert2'){tone(740,.1,'triangle',.05);tone(587,.16,'triangle',.05,.1)}
  else if(k==='full')tone(180,.12,'square',.03);
  else if(k==='door')doorSound();
}
function ensureAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C){AC=new C();audioStart()}}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
let AUD=null;
function noiseBuf(){const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=w*.5+l*3}return b}
function audioStart(){
  const nb=noiseBuf(),mk=(f,type,g)=>{const src=AC.createBufferSource();src.buffer=nb;src.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;const gn=AC.createGain();gn.gain.value=0;src.connect(fl);fl.connect(gn);gn.connect(AC.destination);src.start();return gn};

  AUD={amb:mk(420,'lowpass'),rain:mk(1400,'highpass'),wind:mk(700,'bandpass'),eng:eg,eo,nb};
}
function audioUpdate(){
  if(!AUD||!AC)return;
  musicTick();
  const on=ui.sound&&!G.modal,t=AC.currentTime,run=on&&!G.paused;
  let moving=0;for(const b of G.buses)if(b.state==='drive')moving++;
  const z=clamp(((typeof cam!=='undefined'?cam.zoom:1)-.5)/2.2,0,1),hh=clockHour(G.t),dayT=hh>=6.4&&hh<19,nightT=hh>=19.6,wet=!!(G.event&&(G.event.type==='storm'||G.event.type==='flood')),am=PROF.amb!==false;
  AUD.amb.gain.setTargetAtTime(on?((G.paused?.02:.03)+(am?.045*z:0)):0,t,.3);
  AUD.wind.gain.setTargetAtTime(on&&am?(1-z)*(wet?.045:.022)*(G.paused?.4:1):0,t,.5);
  if(run&&am){
    if(dayT&&z>.35&&!wet&&(G.season==='spring'||G.season==='summer')&&Math.random()<.14){const f=2500+Math.random()*900;tone(f,.07,'sine',.012,0,f*1.4);tone(f*1.1,.06,'sine',.01,.1,f*1.5)}
    if(nightT&&z>.2&&Math.random()<.4){for(let k=0;k<3;k++)tone(4300,.035,'sine',.005,k*.07)}
  }
  AUD.rain.gain.setTargetAtTime(run&&G.event&&(G.event.type==='storm'||G.event.type==='flood')?.05:0,t,.4);
  AUD.eng.gain.setTargetAtTime(run?Math.min(.035,moving*.006)*(.6+.8*z)+(ui.follow?.012:0):0,t,.3);

const MUS={next:0,step:0,bar:0,gain:null};
const CH_CALM=[[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,17]],CH_TENSE=[[0,3,7,10],[8,12,15,19],[5,8,12,15],[7,10,14,17]];

function mtone(f,d,type,vol,when,att){
  try{const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(att||.02));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+d+.05)}catch(e){}
}
function musicTick(){
  if(!AC||!AUD)return;
  if(!MUS.gain){MUS.gain=AC.createGain();MUS.gain.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;MUS.gain.connect(lp);lp.connect(AC.destination)}
  const on=ui.sound&&PROF.music&&!G.modal&&!G.over;
  MUS.gain.gain.setTargetAtTime(on?(G.paused?.35:1):0,AC.currentTime,.7);
  if(!on||G.paused)return;
  const t=AC.currentTime;if(MUS.next<t)MUS.next=t+.05;
  const rush=phaseAt(G.t).p.rush,tense=sat()<.62,beat=tense?.34:rush?.4:.55,chords=tense?CH_TENSE:CH_CALM,root=tense?45:48;
  while(MUS.next<t+1.4){
    const w=MUS.next-t,stp=MUS.step%8,ch=chords[Math.floor(MUS.step/8)%4];
    if(stp===0){ch.forEach((n,i)=>mtone(mf(root+n),beat*8.5,'sine',.014,w,.5));mtone(mf(root+ch[0]-12),beat*3,'triangle',.03,w,.05)}

    if(rush||tense){if(stp%2===0)mtone(mf(root+12+ch[(stp/2)%4]),beat*1.4,'triangle',.011,w,.01)}
    else if(stp===2||stp===6)mtone(mf(root+12+ch[(stp>>1)%4]),beat*2.5,'sine',.009,w,.02);

  const bad=st.filter(x=>!x.ok).slice(0,1),good=st.filter(x=>x.ok).slice(0,2);
  return'<div class="worst" style="background:#fff4e0"><b>Rider stories</b>'+bad.concat(good).map(x=>'<div style="margin:3px 0">'+(x.ok?'♥ ':'✕ ')+esc(x.t)+'</div>').join('')+'</div>';
}

function showReplay(id){
  const h=G.hist&&G.hist[id],st=G.stops.get(id);if(!h||h.w.length<4||!st)return;
  let el=$('#replay');if(!el){el=document.createElement('div');el.id='replay';el.className='panel';$('#app').appendChild(el)}
  const nm=nodeName(G.city.nodes[id]);
  el.innerHTML='<div class="rtop"><b>Replay · '+esc(nm)+'</b><button data-act="replayx" aria-label="Close">✕</button></div><canvas width="420" height="130"></canvas><small>Crowd waiting through the day. Blue ticks are buses stopping here.</small>';
  el.hidden=false;const cv2=el.querySelector('canvas'),g=cv2.getContext('2d'),W2=420,H2=130,n=h.w.length,mx=Math.max(4,...h.w),t0=performance.now(),dur=8000;
  const px=i=>20+(W2-30)*i/(n-1),py=v=>H2-22-(H2-40)*v/mx;
  const fmt=i=>{const hr=clockHour(i*4),a=Math.floor(hr);return String(a).padStart(2,'0')+':'+String(Math.floor((hr-a)*60)).padStart(2,'0')};
  (function frame(now){
    if(el.hidden)return;
    const p=Math.min(1,(now-t0)/dur),k=Math.max(1,Math.floor(p*(n-1)));
    g.clearRect(0,0,W2,H2);g.fillStyle='#f4f7f9';g.fillRect(0,0,W2,H2);
    g.strokeStyle='#d7e0e6';g.lineWidth=1;g.beginPath();g.moveTo(20,H2-22);g.lineTo(W2-10,H2-22);g.stroke();
    g.fillStyle='#5d6b78';g.font='11px sans-serif';g.fillText(fmt(0),14,H2-6);g.fillText(fmt(n-1),W2-44,H2-6);g.fillText(String(mx),2,16);
    g.strokeStyle='#2a7de1';g.lineWidth=1;for(const bi of h.b){if(bi<=k){g.beginPath();g.moveTo(px(bi),H2-22);g.lineTo(px(bi),H2-30);g.stroke()}}
    g.strokeStyle='#e2483d';g.lineWidth=2.5;g.beginPath();for(let i=0;i<=k;i++){const x=px(i),y=py(h.w[i]);i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
    let pk=0;for(let i=0;i<=k;i++)if(h.w[i]>h.w[pk])pk=i;g.fillStyle='#e2483d';g.beginPath();g.arc(px(pk),py(h.w[pk]),4,0,6.3);g.fill();g.fillText(h.w[pk]+' waiting at '+fmt(pk),Math.min(px(pk)+8,W2-110),Math.max(14,py(h.w[pk])-6));
    if(p<1||now-t0<dur+9000)requestAnimationFrame(frame);else el.hidden=true;
  })(t0);
}

const GUIDE_TABS=[['start','Start here'],['tools','Tools & top bar'],['routes','Route buttons'],['stops','Stop buttons'],['riders','Riders'],['money','Money'],['events','Events'],['unlocks','Unlocks'],['strategy','Strategy']];
const GUIDE={
start:`<p><button class="btn alt" data-act="tour">Take the interactive tour</button></p><h3>The goal</h3><p>You run the city's buses. Riders appear at homes in the morning and at offices in the evening, walk to the nearest stop, wait, ride, and walk to where they are going. Get them there before they lose patience.</p>
<ul><li><b>You lose</b> if satisfaction drops below 50% (a bit more forgiving on day 1), or if you go more than $800 into debt.</li><li><b>Satisfaction</b> is the share of the last 50 riders who reached their destination instead of giving up.</li><li><b>You win a level</b> by finishing all its days. Stars come from the level's goals (satisfaction, riders who gave up, profit).</li></ul>
<h3>Your first three minutes</h3><ol><li>Pick <b>Stops</b> and tap a road junction next to a cluster of houses.</li><li>Tap another junction next to offices or shops.</li><li>Pick <b>Route</b>, then tap the first stop and the second stop. A route and a bus appear.</li><li>Press ▶ and watch. Colour tells you who needs help: green is calm, amber is impatient, red is about to give up.</li><li>Open <b>Buses</b> and press + on routes with red stops.</li></ol>
<div class="tip">Rush hours matter most. Mornings move riders from homes to work. Evenings move them back.</div>
<h3>The day</h3><p>Each day runs from 06:00 to 20:00 (plus a night shift if you unlock Night service). The coloured bar under the clock shows quiet, morning rush, midday, evening rush and wind-down. At the end of every day you get a report and a small grant, and the city may grow.</p>`,
tools:`<h3>Bottom toolbar</h3><dl><dt>Select</dt><dd>Tap a stop to open its card. Tap a bus to follow it. Drag to pan, scroll or pinch to zoom, right-drag or twist to rotate.</dd>
<dt>Stops</dt><dd>Tap a road junction to build a stop ($30). Stops sit on the pavement beside the junction.</dd>
<dt>Route</dt><dd>Tap stops in order. The second stop creates the route and gives it a bus. Keep tapping to add more stops. Tap the last stop again, or press Done, to finish. Tap the last stop of an existing route to keep extending it.</dd>
<dt>Buses</dt><dd>Opens the fleet panel with every route and its controls. The number is how many buses you own.</dd>
<dt>Map view</dt><dd>Cycles through Demand (where riders are waiting or being missed), Traffic (where roads are slow) and Coverage (which blocks have a stop within walking distance), then off.</dd></dl>
<h3>Top bar</h3><dl><dt>▶ / ❚❚</dt><dd>Play and pause. You can edit freely while paused. Space also toggles it.</dd><dt>1× 2× 3×</dt><dd>Game speed.</dd><dt>Speaker</dt><dd>Sound on or off.</dd><dt>Undo</dt><dd>Reverses your last change. While you are drawing a route it removes the last stop and keeps you on that route. Your earnings are kept.</dd><dt>Fit map</dt><dd>Re-centres the camera on the whole city.</dd><dt>Menu</dt><dd>Restart today, City Hall, Garage, Share card, Goals, Photo mode, Settings, Trophies, Save slots, Shop, Drivers and this Guide.</dd></dl>
<h3>Helpful extras</h3><ul><li>Phones: the <b>Saver</b> graphics option (Settings) uses lighter scenery and 30 frames a second. It turns on automatically on low-power phones.</li><li>People wave at arriving buses, hurry when they are running out of patience, and open umbrellas in the rain.</li><li>When the hint bar says riders cannot reach their destination, <b>tap it</b>. Red rings show the places they are trying to get to.</li><li>Missions that need a landmark have a <b>Show me</b> button that flies the camera there.</li><li>The <b>Level goals</b> line under the clock tracks your cumulative goals live.</li><li>At the end of a day, <b>Show me</b> on the Worst moment plays a replay of the crowd building up at that stop.</li></ul>
<h3>Drawing bar</h3><p>While you draw a route a bar appears: <b>Undo</b> removes the last stop, <b>New route</b> starts a separate route (useful from the end stop of another route), <b>Done</b> finishes.</p>`,
routes:`<p>Open <b>Buses</b>, then tap a route to see these buttons.</p><dl>
<dt>+ / − buses</dt><dd>Add a bus (costs its price) or remove one (refunds half). More buses mean shorter waits and fewer red stops, but every bus costs money to run.</dd>
<dt>Vehicle size</dt><dd>Upgrades the whole route: Standard (12 seats), Large (18), Articulated (26) and, once unlocked, Tram (40 seats, faster, ignores traffic). Good for busy routes where you can't fit more buses.</dd>
<dt>Express</dt><dd>Buses skip the middle stops and drive faster. Best for long cross-town routes. Unlocks in level 2 (costs $400 once).</dd>
<dt>Loop</dt><dd>Joins the last stop back to the first so buses circle instead of turning around. Good for ring roads and downtown circuits.</dd>
<dt>Reverse</dt><dd>Flips the direction buses travel along the route.</dd>
<dt>Priority lanes</dt><dd>Cuts the traffic delay on this route by a lot ($500 once). Use it on routes through jammed roads (see Traffic view).</dd>
<dt>All day / Rush hours only</dt><dd>Rush-only routes park outside rush hour, saving running costs. Use it on routes that are only busy in the mornings and evenings.</dd>
<dt>Night service</dt><dd>(After you unlock it.) The route keeps running through the night shift at 1.6× fares and 1.25× running costs.</dd>
<dt>Even spacing</dt><dd>Stops buses on this route from bunching up. A bus that catches up with the one ahead waits briefly at the stop. Helps routes with 3+ buses.</dd>
<dt>Extend</dt><dd>Lets you tap more stops onto the end of this route.</dd>
<dt>Shape road</dt><dd>Choose the exact streets the route uses. Tap a junction to bend the route through it, tap a white waypoint to remove it. Use it to avoid jams or to pass a block you want covered.</dd>
<dt>Follow a bus</dt><dd>Camera rides along with one of the route's buses.</dd>
<dt>Delete</dt><dd>Removes the route and refunds half the price of its buses. Stops stay.</dd>
<dt>Name and colour</dt><dd>Tap the name to rename. Tap the colour dot to change colour.</dd></dl>`,
stops:`<p>Tap a stop (with Select) to open its card.</p><dl>
<dt>Waiting riders</dt><dd>The number on the badge is how many are waiting. The colour is the worst patience among them. Red means someone is about to give up.</dd>
<dt>Priority call</dt><dd>For a short time buses hurry to this stop and the people there calm down. It recharges slowly (faster with Priority dispatch), so save it for a real emergency.</dd>
<dt>Move</dt><dd>Moves the stop to another junction ($20).</dd>
<dt>Depot</dt><dd>(Needs the Depot network unlock.) Buses on routes near a depot recover from breakdowns twice as fast and cost a bit less to run. Max 3, $800 each.</dd>
<dt>Ramp ($80)</dt><dd>Makes the stop step-free. Wheelchair users will only use stops with a ramp, so put ramps on stops that connect homes to where they travel.</dd>
<dt>Bike dock ($450)</dt><dd>(After Bike share unlocks.) Pulls riders from much farther away. Expect bigger crowds, so add buses first.</dd>
<dt>Remove</dt><dd>Deletes the stop. Routes that used it are shortened, or removed if only one stop is left.</dd></dl>
<div class="tip">Transfer stops (a stop on more than one route) unlock at Metro Heights, level 3 of the campaign. They let riders change buses, which is how big cities work.</div>`,
riders:`<dl><dt>Commuters</dt><dd>The bulk of your riders. Home to work in the morning, back in the evening.</dd><dt>Students</dt><dd>Pay lower fares and head to schools and the university.</dd><dt>Tourists</dt><dd>Pay more and are more patient. They go to the airport and the stadium.</dd><dt>In a hurry</dt><dd>Pay the most but run out of patience fastest.</dd><dt>Wheelchair users</dt><dd>Need stops with a ramp.</dd><dt>Patients and shoppers</dt><dd>Appear when a hospital or shopping centre opens. Patients are very impatient.</dd></dl>
<h3>Patience colours</h3><ul><li><b>Green</b>: calm.</li><li><b>Amber</b>: getting impatient.</li><li><b>Red</b>: about to give up. Every rider who gives up lowers satisfaction.</li></ul>
<h3>Thought bubbles</h3><p>Now and then a bubble appears near people who cannot reach where they want to go. Build a stop there or connect their area to the route network.</p>
<h3>Landmarks</h3><p>As you deliver more riders, a university, school, airport, shopping centre and hospital open on empty blocks. They create new destinations, so give them a stop nearby.</p>`,
money:`<ul><li><b>Income</b>: every rider who arrives pays a fare ($3 to $10; night fares are higher). You also get a grant at the end of each day and mission rewards.</li><li><b>Costs</b>: stops, buses, upgrades, and a running cost for each moving bus (bigger vehicles cost more). Running costs are why too many buses on a quiet route loses money.</li><li><b>Faster engines</b>: speeds every bus up 12% (twice available). Costs a lot, so wait until you have spare cash.</li><li><b>Bankruptcy</b>: below -$800 you lose. If you get stuck, 'Retry from today' restores the start of the day with a small relief grant.</li></ul>
<div class="tip">The end-of-day report shows fares, running costs and profit per route. Cut or shorten any route that loses money.</div>
<h3>Missions</h3><p>The panel under the clock shows today's missions, like delivering a number of riders before noon. They pay cash and company XP. Tap the panel on a phone to see all of them.</p>`,
events:`<dl><dt>Road closure / Parade</dt><dd>Roads are blocked. Buses detour automatically. Check your routes still connect.</dd><dt>Accident</dt><dd>A road is blocked for a short while. A hospital helps clear it faster.</dd><dt>Storm</dt><dd>Riders lose patience faster.</dd><dt>Flooding</dt><dd>Like a storm, and low roads near water close.</dd><dt>Snow</dt><dd>In winter. A road is blocked and all buses are slower.</dd><dt>Fog</dt><dd>Buses and traffic slow down.</dd><dt>Concert</dt><dd>When it ends a big crowd heads home from the arena. Put a stop near it and add buses.</dd><dt>Breakdown</dt><dd>One bus stops for a while. Extra buses cover the gap, and depots speed up the recovery.</dd></dl>
<div class="tip">Seasons change the look of the city and the odds of events. Events are your reason to keep a cash buffer.</div>`,
unlocks:`<dl><dt>Company level and XP</dt><dd>You earn XP for deliveries, missions, trophies and finishing days. Levels carry over between games.</dd><dt>City Hall</dt><dd>Spend cash on permanent upgrades once your company level is high enough: arrival signs (more patient riders), depot network, electric buses (cheaper running), priority dispatch, smart traffic lights, night service, bike share and trams.</dd><dt>Garage</dt><dd>Cosmetics: bus paint, stop signs and tower styles, unlocked by level.</dd><dt>Drivers</dt><dd>Every bus has a named driver. Drivers earn experience for every rider they deliver and level up: Rookie, Steady, Pro, Veteran, Legend. Higher levels drive faster and stop quicker, and they keep their levels across games.</dd><dt>Mayor requests</dt><dd>From day 2 the mayor sometimes adds a special mission (marked with a flag): serve a landmark, link two places by bus, keep everyone happy until 09:30, or grow your fleet. They pay extra cash and XP.</dd><dt>Rider stories</dt><dd>A few riders each day have names and jobs. Their stories, good and bad, appear in the day report.</dd><dt>New game plus</dt><dd>After you finish the whole campaign, a Plus difficulty appears in Settings with tougher patience, income and running costs.</dd><dt>Backup and restore</dt><dd>In Settings you can copy a backup code of your profile, drivers and saves, and paste it later on any device.</dd><dt>Trophies</dt><dd>Achievements for things like your first route, a spotless day, a loop route or a tram.</dd><dt>Levels</dt><dd>Eleven campaign maps get harder, plus Sandbox (endless, no game over), a Daily Challenge and a Weekly Challenge. Difficulty and settings are in the menu.</dd></dl>`,
strategy:`<h3>Build well</h3><ul><li>Put your first two stops between the biggest group of houses and the biggest group of offices. Glowing blocks are where riders appear.</li><li>Use <b>Coverage</b> map view to find blocks that have no stop. Red blocks are riders you are missing.</li><li>Long straight routes with few turns beat tangled ones. Use <b>Shape road</b> to dodge jams instead of adding more stops.</li><li>Use <b>Loop</b> for rings and downtown circuits, <b>Express</b> for long trips, and transfers for big cities (a few busy trunk routes feeding smaller local ones).</li></ul>
<h3>Run well</h3><ul><li>Check the stops first thing in the rush. Add a bus to the route with the red stops, not to every route.</li><li>If a route is full and cannot take another bus (roads get jammed), upgrade the vehicle size.</li><li>Quiet routes: switch to <b>Rush hours only</b> or cut a bus. Busy routes: add buses before upgrading.</li><li>Turn on <b>Even spacing</b> when buses on a long route clump together.</li><li>Use <b>Priority call</b> on a single stop that is about to explode, not as a habit.</li><li>Put ramps on stops that join residential blocks to the network once wheelchair users appear.</li></ul>
<h3>Stay safe</h3><ul><li>Keep a cash buffer of at least one or two buses. Events cost you.</li><li>Do not add night service or bike docks until your day routes are stable.</li><li>Read the day report: 'Worst moment' shows where you lost the most riders. Tap <b>Show me</b> and fix that stop.</li><li>If a day goes badly, use Retry from today and try a different plan.</li></ul>
<h3>Get ahead</h3><ul><li>Finish missions: they are an easy source of cash and XP.</li><li>Unlock Priority dispatch, Arrival signs and Electric buses in City Hall early, since they help every game.</li><li>Keep your best drivers on your busiest routes by not deleting those buses.</li></ul>`
};

function doImport(){
  const t=($('#bkin').value||'').trim();if(!t){toast('Paste a backup code first.');return}
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(t))));if(!d||d.v!=='rhr-backup'||!d.profile||d.profile.v!==1)throw 0;
    for(const k of Object.keys(PROF))delete PROF[k];Object.assign(PROF,PROF_DEF(),d.profile);saveProfile();
    d.saves.forEach((raw,i)=>{try{if(raw)localStorage.setItem(slotKey(i+1),raw)}catch(e){}});
    try{if(d.stars)localStorage.setItem('rhr.stars',d.stars)}catch(e){}
    applyA11y();toast('Backup restored.');showBackup(ui.setFrom);
  }catch(e){toast('That code is not valid.')}
}

function startTour(){
  ui.tour={i:-1,was:G.paused};G.paused=true;G.modal=true;syncPlay();
  let el=$('#tour');if(!el){el=document.createElement('div');el.id='tour';$('#app').appendChild(el)}

function tourStep(d){
  const tr=ui.tour;if(!tr)return;let i=tr.i+d;
  while(i>=0&&i<TOUR.length){const e=document.querySelector(TOUR[i].sel);if(e&&e.getBoundingClientRect().width>2&&!e.closest('[hidden]'))break;i+=d}
  if(i<0)i=0;
  if(i>=TOUR.length){endTour();return}
  tr.i=i;const st=TOUR[i],e=document.querySelector(st.sel),r=e.getBoundingClientRect(),el=$('#tour'),below=r.top<innerHeight/2;
  el.innerHTML='<div class="tspot" style="left:'+(r.left-6)+'px;top:'+(r.top-6)+'px;width:'+(r.width+12)+'px;height:'+(r.height+12)+'px"></div><div class="tcard" style="'+(below?'top:'+Math.min(innerHeight-190,r.bottom+16)+'px':'bottom:'+Math.max(10,innerHeight-r.top+16)+'px')+'"><b>'+esc(st.title)+'</b><p>'+esc(st.text)+'</p><div class="tbtns"><span>'+(i+1)+' / '+TOUR.length+'</span><button data-act="tourskip">Skip</button>'+(i>0?'<button data-act="tourback">Back</button>':'')+'<button class="go" data-act="tournext">'+(i===TOUR.length-1?'Done':'Next')+'</button></div></div>';
}
function endTour(){
  const tr=ui.tour;ui.tour=null;PROF.tourDone=true;saveProfile();
  const el=$('#tour');if(el){el.hidden=true;el.innerHTML=''}
  G.modal=false;if(tr)G.paused=tr.was;syncPlay();ui.dirty=true;
}

/* ================= road graph ================= */
const edgeBetween=(a,b)=>G.city.edgeMap.get(a*4096+b);
function roadPath(a,b,avoid){
  if(a===b)return[a];
  const N=G.city.nodes,dist=new Map([[a,0]]),prev=new Map(),done=new Set();
  while(true){
    let u=-1,ud=1e18;
    for(const[k,d]of dist)if(!done.has(k)&&d<ud){ud=d;u=k}
    if(u<0)return null;
    if(u===b)break;
    done.add(u);
    for(const nb of N[u].adj){
      if(avoid&&nb.e.closed)continue;
      const nd=ud+nb.e.len;
      if(!dist.has(nb.to)||nd<dist.get(nb.to)){dist.set(nb.to,nd);prev.set(nb.to,u)}
    }
  }
  const p=[b];let c=b;while(c!==a){c=prev.get(c);p.push(c)}
  return p.reverse();
}

/* ================= transit planning ================= */
const busSpeed=r=>BUS_SPEED*(r.express?1.7:1)*BUS_MODELS[r.model||0].spd*(1+.12*G.engine)*(G.fogMult||1)*(G.season==='winter'?.9:1);
const rushNow=()=>!!phaseAt(G.t).p.rush;
function routeActive(r){const p=phaseAt(G.t).p;return p.night?!!r.night:(r.sched!=='peak'||!!p.rush)}
function isServed(r,sid){const i=r.stops.indexOf(sid);return i>=0&&(!r.express||i===0||i===r.stops.length-1)}
function buildTG(){
  const adj=new Map(),rush=rushNow();
  for(const r of G.routes){
    const nb=r.buses.length;if(!nb)continue;
    if(!routeActive(r))continue;
    const sp=busSpeed(r),n=r.stops.length,idx=r.express?[0,n-1]:r.stops.map((_,i)=>i);
    const total=r.loop?r.loopLen:r.cum[n-1];
    const cycle=(r.loop?total:2*total)/sp+n*2.4,wait=Math.min(cycle/(2*nb),70),m=idx.length;
    for(let a=0;a<m;a++)for(let b=0;b<m;b++){
      if(a===b)continue;
      const ia=idx[a],ib=idx[b];
      let d;if(r.loop)d=ib>ia?r.cum[ib]-r.cum[ia]:r.loopLen-r.cum[ia]+r.cum[ib];else d=Math.abs(r.cum[ib]-r.cum[ia]);
      const hops=r.loop?((b-a)+m)%m:Math.abs(b-a),from=r.stops[ia];
      if(!adj.has(from))adj.set(from,[]);
      adj.get(from).push({r,to:r.stops[ib],cost:wait+d/sp+hops*1.2});
    }
  }
  G.tg=adj;G.tgVer=G.netVer;
}
function planFrom(sid,dest,acc){
  if(G.tgVer!==G.netVer)buildTG();
  const dist=new Map([[sid,0]]),prev=new Map(),done=new Set();
  while(true){
    let u=null,ud=1e18;
    for(const[k,d]of dist)if(!done.has(k)&&d<ud){ud=d;u=k}
    if(u===null)break;
    done.add(u);
    const es=G.tg.get(u);if(!es)continue;
    for(const e of es){
      if(acc){const t=G.stops.get(e.to);if(!t||!t.access)continue}
      const nd=ud+e.cost;if(!dist.has(e.to)||nd<dist.get(e.to)){dist.set(e.to,nd);prev.set(e.to,{from:u,e})}
    }
  }
  let best=null;
  for(const[id,d]of dist){
    const st=G.stops.get(id);if(!st)continue;
    if(acc&&!st.access)continue;
    const w=Math.hypot(st.x-dest.x,st.y-dest.y);if(w>MAXWALK)continue;
    const tot=d+w/WALK*1.15;
    if(!best||tot<best.tot)best={id,tot};
  }
  if(!best)return null;
  if(best.id===sid)return{exit:true,tot:best.tot};
  let cur=best.id,pe=prev.get(cur);
  while(pe.from!==sid){cur=pe.from;pe=prev.get(cur)}
  return{exit:false,route:pe.e.r,alight:pe.e.to,tot:best.tot};
}

const blockKey=(x,y)=>Math.floor((x-MARGIN)/S)+','+Math.floor((y-MARGIN)/S);
function pickRider(){const ts=G.L.riders;let tot=0;for(const t of ts)tot+=RIDERS[t].w;let x=rnd()*tot;for(const t of ts){x-=RIDERS[t].w;if(x<=0)return t}return ts[0]}
function stopNear(x,y,r){for(const st of G.stops.values())if(Math.hypot(st.x-x,st.y-y)<r)return true;return false}
function react(x,y,txt,col,chance){if(rnd()>(chance==null?1:chance))return;if(G.t-G.reactT<.9&&G.t>=G.reactT)return;G.reactT=G.t;fx.text(x,y-10,txt,col||'#e0509a')}
function rivalSteal(o){
  const rv=G.rival;if(!rv.stops.length)return false;
  let rd=1e9;for(const id of rv.stops){const n=G.city.nodes[id];const d=Math.hypot(n.x-o.x,n.y-o.y);if(d<rd)rd=d}
  if(rd>120)return false;
  let pd=1e9;for(const st of G.stops.values()){const d=Math.hypot(st.x-o.x,st.y-o.y);if(d<pd)pd=d}
  return rnd()<(pd>rd+40?.5:pd>rd?.2:.05);
}
function spawnCitizen(orig,destList){
  let type=pickRider();const C=G.city,lm=C.landmarks||{};
  let list=destList;
  if(destList===C.works){
    const rr=rnd();

    else if(lm.mall&&rr<.13&&stopNear(lm.mall.x,lm.mall.y,260)){type='shopper';list=[lm.mall]}
    else if(type==='student'&&lm.school&&stopNear(lm.school.x,lm.school.y,260)&&rnd()<.7)list=[lm.school];
  }
  const R_=RIDERS[type];
  if(destList===C.works){
    if(type==='tourist'){if(lm.air&&stopNear(lm.air.x,lm.air.y,260)&&rnd()<.7)list=[lm.air];else if(C.venue&&stopNear(C.venue.x,C.venue.y,260))list=[C.venue]}
    else if(type==='student'&&lm.uni&&stopNear(lm.uni.x,lm.uni.y,260)&&rnd()<.6)list=[lm.uni];
  }
  if(false){G.lostRival++;G.dayLost++;fx.text(orig.x,orig.y-8,'→ Rival','#e08a2b');return}
  const dst=list[Math.floor(rnd()*list.length)],pm=G.L.patience*R_.pm*(has('signs')?1.12:1),fare=Math.max(1,Math.round(R_.fare*(G.fareMult||1)));
  const dk=dst.type==='landmark'?dst.kind:(dst.type==='venue'?'venue':'work'),nt=!!phaseAt(G.t).p.night;
  const c={id:++G.nid,type,fare:nt?Math.round(fare*1.6):fare,state:'walk',x:orig.x,y:orig.y,dest:{x:dst.x,y:dst.y},dk,p:nt?pm*1.3:pm,pm:nt?pm*1.3:pm,stop:null,plan:null,planVer:-1,noRoute:false,retry:0,alight:null,seed:rnd(),wstart:0,lastRoute:null,ob:blockKey(orig.x,orig.y),db:blockKey(dst.x,dst.y)};
  if(rnd()<.08){const jb=R_JOBS[type]||['resident'];c.story={name:R_NAMES[Math.floor(rnd()*R_NAMES.length)],job:jb[Math.floor(rnd()*jb.length)]}}
  G.citizens.push(c);assignStop(c);
}
function assignStop(c){
  const acc=c.type==='wheel';
  const cand=[...G.stops.values()].filter(s=>!acc||s.access).map(s=>({s,d:Math.hypot(s.x-c.x,s.y-c.y)*(s.bike?.45:1)})).sort((a,b)=>a.d-b.d).slice(0,5);
  let best=null;
  for(const o of cand){
    let pl=planFrom(o.s.id,c.dest,acc);
    if(pl&&pl.exit&&Math.hypot(c.x-c.dest.x,c.y-c.dest.y)>MAXWALK)pl=null;
    if(!pl)continue;
    const sc=o.d/WALK*1.3+pl.tot;
    if(!best||sc<best.sc)best={s:o.s,pl,sc};
  }
  c.state='walk';
  if(best){
    if(best.pl.exit){c.state='walkDest';c.stop=null;c.noRoute=false;return}
    c.stop=best.s;c.plan=best.pl;c.planVer=G.netVer;c.noRoute=false;
  }else if(cand.length){c.stop=cand[0].s;c.plan=null;c.noRoute=true;c.planVer=G.netVer}
  else{c.stop=null;c.noRoute=true;c.retry=1}
}
function joinStop(c){
  const st=c.stop;
  if(!st||G.stops.get(st.id)!==st){assignStop(c);return}
  c.x=st.x;c.y=st.y;c.state='wait';c.wstart=G.t;st.waiters.push(c);replanWaiter(c);
  if(st.waiters.length>(st.peak||0)){st.peak=st.waiters.length;st.peakT=G.t}
}
function replanWaiter(c){
  const st=c.stop;
  const pl=planFrom(st.id,c.dest,c.type==='wheel');
  c.planVer=G.netVer;
  if(pl&&pl.exit){leaveStop(c);c.state='walkDest';c.stop=null;c.plan=null;c.noRoute=false;return}
  c.plan=pl;c.noRoute=!pl;
}
function leaveStop(c){const w=c.stop&&c.stop.waiters;if(w){const i=w.indexOf(c);if(i>=0)w.splice(i,1)}}
function stopStatus(st){
  let s=0;
  for(const c of st.waiters){const f=c.p/c.pm;if(f<.2)return 2;if(f<.5)s=1}
  if(st.waiters.length>=14)s=Math.max(s,1);
  return s;
}
function pcol(c){const f=c.p/c.pm;return f>.5?COL.ok:f>.2?COL.warn:COL.bad}
function giveUp(c){
  if(c.story){const sn=c.stop?nodeName(G.city.nodes[c.stop.id]):'the street';addStory(false,c.story.name+', '+an(c.story.job)+', gave up waiting at '+sn+' and walked instead.')}
  if(c.stop)c.stop.gaveDay=(c.stop.gaveDay||0)+1;
  if(c.ob){G.gaveBlock=G.gaveBlock||{};G.gaveBlock[c.ob]=(G.gaveBlock[c.ob]||0)+1}
  leaveStop(c);
  const i=G.citizens.indexOf(c);if(i>=0)G.citizens.splice(i,1);
  G.gaveUp++;G.dayGave++;G.combo=0;outcome(false);
  fx.text(c.x,c.y-6,'✕',COL.bad);snd('sad');
  if(ui.vibrate&&navigator.vibrate)try{navigator.vibrate(20)}catch(e){}
}
function deliver(c){
  const i=G.citizens.indexOf(c);if(i>=0)G.citizens.splice(i,1);
  if(c.lastBus&&c.lastBus.drv)drvXp(c.lastBus.drv);
  if(c.story){addStory(true,c.story.name+', '+an(c.story.job)+', arrived '+(G.t-c.wstart>14?'after waiting '+Math.round(G.t-c.wstart)+'s. Thank you!':'without a fuss.'));if(rnd()<.5)fx.text(c.dest.x,c.dest.y-34,'Thanks, '+c.story.name+'!','#e0509a')}
  G.delivered++;G.dayDel++;if(c.xfer)G.xferDelivered=(G.xferDelivered||0)+1;outcome(true);
  G.combo=(G.combo||0)+1;if(G.combo%12===0){const bn=20+G.combo;G.money+=bn;G.rev+=bn;fx.text(c.dest.x,c.dest.y-24,'Streak '+G.combo+'! +$'+bn,'#e0509a');if(G.combo>=50)ach('combo50')}
  G.money+=c.fare;G.rev+=c.fare;G.dayRev+=c.fare;G.mDel++;G.mDest[c.dk]=(G.mDest[c.dk]||0)+1;addXp(1);PROF.stat.delivered++;if(PROF.stat.delivered>=5000)ach('tycoon');
  if(G.t-c.wstart>14)react(c.x,c.y,'Thanks!','#e0509a',.35);else react(c.x,c.y,'♥','#e0509a',.05);
  const r=c.lastRoute;if(r&&G.routes.includes(r))r.stat.rev+=c.fare;
  fx.text(c.x,c.y-6,'+$'+c.fare,COL.ok);snd('deliver');
}
function moveTo(c,tx,ty,dt){const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy),s=WALK*dt;if(d<=s){c.x=tx;c.y=ty;return true}c.x+=dx/d*s;c.y+=dy/d*s;return false}
function thinkTick(dt){
  for(let i=G.bubbles.length-1;i>=0;i--){
    const b=G.bubbles[i];b.t+=dt;
    if(b.c&&G.citizens.includes(b.c)&&(b.c.state==='walk'||b.c.state==='wait')){b.x=b.c.x;b.y=b.c.y}
    if(b.t>=b.life)G.bubbles.splice(i,1);
  }
  G.thinkT-=dt;
  if(G.thinkT>0||G.bubbles.length||tutOn())return;
  const pool=[];
  for(const c of G.citizens){
    let neglected=false;
    if(c.state==='walk'){
      if(!c.stop)neglected=c.p<c.pm*.97;
      else neglected=Math.hypot(c.stop.x-c.x,c.stop.y-c.y)>170;
    }else if(c.state==='wait')neglected=c.noRoute&&c.p<c.pm*.8;
    if(!neglected)continue;
    let near=false;
    for(const m of G.thinkMem)if(G.t-m.t<70&&Math.hypot(m.x-c.x,m.y-c.y)<140){near=true;break}
    if(!near)pool.push(c);
  }
  if(!pool.length){G.thinkT=3;return}
  const c=pool[Math.floor(rnd()*pool.length)];
  G.bubbles.push({c,x:c.x,y:c.y,t:0,life:6,wheel:c.type==='wheel'});
  G.thinkMem.push({x:c.x,y:c.y,t:G.t});if(G.thinkMem.length>8)G.thinkMem.shift();
  G.thinkT=22+rnd()*16;
  if(!G.thinkSeen){G.thinkSeen=true;toast('A thought bubble: someone has no good bus service nearby.',3600)}
  else if(c.type==='wheel'&&!G.wheelSeen){G.wheelSeen=true;toast('A wheelchair user needs a step-free stop. Upgrade a stop with a ramp.',4200)}
}
function updCitizens(dt){
  const m=G.stormMult;
  for(let i=G.citizens.length-1;i>=0;i--){
    const c=G.citizens[i];
    if(c.state==='ride')continue;
    if(c.state==='walk'){
      if(!c.stop){c.p-=dt*m;c.retry-=dt;if(c.retry<=0){c.retry=1;assignStop(c)}}
      else{c.p-=dt*m*.5;if(moveTo(c,c.stop.x,c.stop.y,dt))joinStop(c)}
    }else if(c.state==='wait'){
      c.p-=dt*m*((c.stop&&c.stop.prio>0)?.35:1);
      if(c.planVer!==G.netVer)replanWaiter(c);
    }else if(c.state==='walkDest'){
      if(moveTo(c,c.dest.x,c.dest.y,dt)){deliver(c);continue}
    }
    if(c.state!=='walkDest'&&c.p<=0)giveUp(c);
  }
}

/* ================= outcomes ================= */
function sat(){const n=G.win.length;if(n<6)return 1;let s=0;for(const v of G.win)s+=v;return s/n}
function outcome(ok){
  G.win.push(ok?1:0);if(G.win.length>WIN_N)G.win.shift();
  G.flashSat=1;
  if(G.win.length>=30&&sat()<(G.day===1?.4:.5)&&!G.over&&!G.L.sandbox)gameOver('sat');
}

/* ================= routes & buses ================= */
function fleetUsed(){return G.buses.length}
function segPath(r,a,b){
  const v=r.via||{};let via=v[a+'>'+b]||null;
  if(!via&&v[b+'>'+a])via=v[b+'>'+a].slice().reverse();
  const pts=[a].concat(via||[],[b]),out=[a];
  for(let k=0;k<pts.length-1;k++){const p=roadPath(pts[k],pts[k+1],false)||[pts[k],pts[k+1]];for(let j=1;j<p.length;j++)out.push(p[j])}
  return out;
}
function recalcRoute(r){
  r.segs=[];r.cum=[0];const N=G.city.nodes;
  const plen=p=>{let l=0;for(let k=0;k<p.length-1;k++)l+=Math.hypot(N[p[k]].x-N[p[k+1]].x,N[p[k]].y-N[p[k+1]].y);return l};
  for(let i=0;i<r.stops.length-1;i++){
    const p=segPath(r,r.stops[i],r.stops[i+1]);
    r.segs.push(p);r.cum.push(r.cum[i]+plen(p));
  }
  const n=r.stops.length;
  if(r.loop&&n>=3){const p=segPath(r,r.stops[n-1],r.stops[0]);r.segs.push(p);r.loopLen=r.cum[n-1]+plen(p)}
  else{r.loop=false;r.loopLen=r.cum[n-1]*2}
}
function legPath(r,from,to){
  const n=r.stops.length;
  if(r.loop&&from===n-1&&to===0)return r.segs[n-1];
  if(to===from+1)return r.segs[from];
  if(to===from-1){const p=r.segs[to];return p?p.slice().reverse():null}
  return null;
}
function distPtSeg(n,A,B){
  const dx=B.x-A.x,dy=B.y-A.y,l2=dx*dx+dy*dy||1,t=clamp(((n.x-A.x)*dx+(n.y-A.y)*dy)/l2,0,1);
  return Math.hypot(n.x-(A.x+dx*t),n.y-(A.y+dy*t));
}
function shapeTap(n){
  const r=G.routes.find(x=>x.id===ui.shape);if(!r){ui.shape=null;ui.dirty=true;return}
  r.via=r.via||{};
  for(const key in r.via){const i=r.via[key].indexOf(n.id);if(i>=0){pushUndo();r.via[key].splice(i,1);if(!r.via[key].length)delete r.via[key];recalcRoute(r);netChanged();toast('Waypoint removed.');return}}
  if(r.stops.includes(n.id)){toast('Pick a junction between two stops to bend the route.');return}
  let total=0;for(const k in r.via)total+=r.via[k].length;
  if(total>=8){toast('That is plenty of bends (8 max).');return}
  const N=G.city.nodes;let best=null;
  r.segs.forEach((p,si)=>{for(let k=0;k<p.length-1;k++){const d=distPtSeg(n,N[p[k]],N[p[k+1]]);if(!best||d<best.d)best={d,si,k}}});
  if(!best)return;
  const ns=r.stops.length,a=r.stops[best.si],b=best.si>=ns-1?r.stops[0]:r.stops[best.si+1],key=a+'>'+b;
  pushUndo();
  const arr=(r.via[key]||[]).slice(),seg=r.segs[best.si];let pos=arr.length;
  for(let j=0;j<arr.length;j++){const ix=seg.indexOf(arr[j]);if(ix>best.k){pos=j;break}}
  arr.splice(pos,0,n.id);r.via[key]=arr;ach('bend');
  recalcRoute(r);netChanged();fx.ring(n.x,n.y,r.color,30);snd('pop');
}
function rebuildVis(){
  const use=new Map();
  for(const r of G.routes)for(const p of r.segs)for(let k=0;k<p.length-1;k++){
    const e=edgeBetween(p[k],p[k+1]);if(!e)continue;
    if(!use.has(e.id))use.set(e.id,[]);const a=use.get(e.id);if(!a.includes(r.id))a.push(r.id);
  }
  const N=G.city.nodes;
  for(const r of G.routes){
    r.vis=[];
    for(const p of r.segs){
      const pts=[];
      for(let k=0;k<p.length-1;k++){
        const A=N[p[k]],B=N[p[k+1]],e=edgeBetween(p[k],p[k+1]),l=use.get(e.id)||[r.id];
        const off=(l.indexOf(r.id)-(l.length-1)/2)*5.5,dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy),nx=-dy/d*off,ny=dx/d*off;
        pts.push([A.x+nx,A.y+ny],[B.x+nx,B.y+ny]);
      }
      r.vis.push(pts);
    }
  }

/* ================= simulation step ================= */
function phaseAt(t){
  let a=0;
  for(let i=0;i<PH.length;i++){const p=PH[i];if(t<a+p.len)return{p,pt:t-a,i};a+=p.len}
  const p=PH[PH.length-1];return{p,pt:p.len,i:PH.length-1};
}
function clockHour(t){const ph=phaseAt(t);return ph.p.from+(ph.p.to-ph.p.from)*clamp(ph.pt/ph.p.len,0,1)}
function updCong(){
  const C=G.city,ph=phaseAt(G.t).p,rf=ph.rush?1:ph.id==='mid'?.35:.15;
  if(!C.congInit){
    const cx=C.w/2,cy=C.h/2,mr=Math.hypot(cx,cy)*.75,R=rng(C.seed+9);
    for(const e of C.edges){const A=C.nodes[e.a],B=C.nodes[e.b];e.dn=clamp(Math.hypot((A.x+B.x)/2-cx,(A.y+B.y)/2-cy)/mr,0,1);e.cb=R()*.1}
    C.congInit=true;
  }
  const cnt=new Map();
  for(const b of G.buses){const e=edgeBetween(b.from,b.to);if(e)cnt.set(e,(cnt.get(e)||0)+1)}
  for(const e of C.edges)e.cong=clamp(rf*.42*Math.pow(1-e.dn,1.3)+e.cb*rf+Math.max(0,(cnt.get(e)||0)-1)*.1,0,.65);
}
function step(dt){
  if(G.over)return;
  G.t+=dt;
  const ph=phaseAt(G.t),L=G.L,total=L.perDay*(1+.12*(G.day-1))*(G.season==='summer'?1.12:1);
  if(ph.p.id!==G.lastPhase){G.lastPhase=ph.p.id;G.netVer++;G.congT=0}
  G.congT-=dt;if(G.congT<=0){G.congT=.5;updCong()}
  G.histT=(G.histT||0)-dt;if(G.histT<=0){G.histT=4;G.hist=G.hist||{};for(const st of G.stops.values()){const hh=(G.hist[st.id]=G.hist[st.id]||{w:[],b:[]});hh.w.push(st.waiters.length)}}
  if(!ph.p.night||G.routes.some(r=>r.night&&r.buses.length))G.acc+=total*ph.p.share/ph.p.len*dt;
  while(G.acc>=1){
    G.acc-=1;
    const kind=ph.p.dir==='mix'?(rnd()<.5?'home':'work'):ph.p.dir;
    const C=G.city,lm=C.landmarks||{};
    if(kind==='home')spawnCitizen(C.homes[Math.floor(rnd()*C.homes.length)],C.works);
    else{
      let o=C.works[Math.floor(rnd()*C.works.length)];
      if(rnd()<.18){const l=[lm.uni,lm.air,lm.hosp,lm.school,lm.mall].filter(Boolean);if(l.length)o=l[Math.floor(rnd()*l.length)]}
      spawnCitizen(o,C.homes);
    }
  }
  for(const ev of G.evPlan)if(!ev.done&&ph.p.id===ev.phase&&ph.pt>=ev.at&&!G.event)startEvent(ev);
  const ev=G.event;
  if(ev){ev.t+=dt;if(ev.t>=ev.dur)endEvent()}
  updCitizens(dt);thinkTick(dt);rivalTick(dt);
  const eco=(has('electric')?.7:1);
  for(const b of G.buses){
    updBus(b,dt);
    if(b.state!=='parked'){const c=BUS_MODELS[b.route.model||0].cost*dt*eco*(b.route.depot?.85:1)*(ph.p.night?1.25:1)*(G.costMult||1);G.money-=c;G.cost+=c;G.dayCost+=c;b.route.stat.cost+=c}
  }
  for(const r of G.routes){if(r.buses.length){let f=0;for(const b of r.buses)f+=b.pax.length/b.cap;r.stat.loadSum+=f/r.buses.length*dt;r.stat.loadN+=dt}}
  if(G.prioCD>0)G.prioCD-=dt;
  for(const st of G.stops.values()){if(st.cheer>0)st.cheer-=dt;if(st.missed>0)st.missed-=dt;if(st.prio>0)st.prio-=dt}
  for(const k in G.gaveBlock){G.gaveBlock[k]*=1-dt*.012;if(G.gaveBlock[k]<.05)delete G.gaveBlock[k]}
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.a+=dt/p.life;if(p.a>=1)G.parts.splice(i,1)}
  if(G.flashSat>0)G.flashSat-=dt*2;
  G.lmT-=dt;if(G.lmT<=0){G.lmT=2;landmarkTick();tickMissions()}
  if(!L.sandbox&&G.money<-800&&!G.over){gameOver('bankrupt');return}
  if(G.t>=DAY_LEN&&!G.over&&!G.dayEnding){G.dayEnding=true;endOfDay()}
}

const MY_NAMES={hosp:'hospital',mall:'shopping centre',school:'school',uni:'university',air:'airport',venue:'arena',down:'business district',res:'residential area'};
function mayorTargets(){

function servedBy(t){for(const r of G.routes){if(!r.buses.length)continue;for(const sid of r.stops){const st=G.stops.get(sid);if(st&&Math.hypot(st.x-t.x,st.y-t.y)<160)return true}}return false}

function completeMission(m){

function tickMissions(){

function finishMissions(){

function rivalTick(dt){
  const N=G.city.nodes;
  for(const rt of G.rival.routes){
    const p=rt.path;let move=52*dt,guard=0;
    while(move>0&&guard++<10){
      const a=N[p[rt.seg]],bi=rt.seg+rt.dir;
      if(bi<0||bi>=p.length){rt.dir=-rt.dir;continue}
      const b=N[p[bi]],len=Math.hypot(b.x-a.x,b.y-a.y),rem=len-rt.s;
      if(move<rem){rt.s+=move;move=0}else{move-=rem;rt.seg=bi;rt.s=0}
    }
    const a=N[p[rt.seg]],bi=clamp(rt.seg+rt.dir,0,p.length-1),b=N[p[bi]],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;
    rt.ang=Math.atan2(dy,dx);rt.x=a.x+dx/l*rt.s-dy/l*-5.5*-1;rt.y=a.y+dy/l*rt.s+dx/l*5.5*-1;
    rt.x=a.x+dx/l*rt.s+(-dy/l)*5.5;rt.y=a.y+dy/l*rt.s+(dx/l)*5.5;
  }
}
function rivalExpand(){
  const C=G.city,rv=G.rival,cap=2+G.day;if(rv.stops.length>=cap)return;

    if(near)continue;
    for(const id of rv.stops){const o=C.nodes[id];if(Math.hypot(o.x-n.x,o.y-n.y)<100){near=true;break}}
    if(near)continue;

    const bk=Math.floor((n.x-MARGIN)/S)+','+Math.floor((n.y-MARGIN)/S);sc+=(G.gaveBlock[bk]||0)*3+rnd()*2;

/* ================= undo ================= */
function netSnap(){
  return{money:G.money,rev:G.rev,cost:G.cost,engine:G.engine,
    stops:[...G.stops.values()].map(s=>({id:s.id,acc:!!s.access,bike:!!s.bike})),

    depots:[...G.depots.keys()]};
}
function pushUndo(){

function restoreNet(d){
  const want=new Set(d.stops.map(s=>s.id));
  for(const r of G.routes.slice())deleteRoute(r);
  for(const id of [...G.stops.keys()])if(!want.has(id))removeStop(id);
  for(const s of d.stops){const st=addStop(s.id,true);if(st){st.access=s.acc;st.bike=!!s.bike}}
  for(const rd of d.routes){
    const r=newRoute(rd.stops);r.name=rd.name;r.color=rd.color;r.express=rd.express;r.expressPaid=rd.ep;r.loop=rd.loop;r.lane=rd.lane;r.sched=rd.sched;r.night=!!rd.night;r.model=rd.model;r.spacing=!!rd.spacing;r.via=JSON.parse(JSON.stringify(rd.via||{}));recalcRoute(r);
    for(let k=0;k<rd.buses;k++)addBus(r,true);
  }
  G.depots=new Map();for(const id of d.depots){const n=G.city.nodes[id],[sx,sy]=stopCorner(G.city,n);G.depots.set(id,{id,x:n.x+sx*34,y:n.y+sy*30,sx,sy})}
  G.money=(d.rev!==undefined)?d.money+((G.rev-d.rev)-(G.cost-d.cost)):d.money;G.engine=d.engine;ui.sel=null;ui.drawing=null;ui.shape=null;ui.moving=null;G.netVer++;netChanged();
}
function undo(){
  if(ui.drawing){undoDraw();toast(ui.drawing&&ui.drawing.routeId?'Removed the last stop. Keep going or press Done.':'Cancelled. Tap a stop to start again.');snd('pop');ui.dirty=true;return}
  const sg=n=>JSON.stringify(n.stops)+JSON.stringify(n.routes)+n.engine+'|'+n.depots.join(','),now=sg(netSnap());
  let d=ui.undo.pop();while(d&&sg(d)===now)d=ui.undo.pop();
  if(!d){toast('Nothing to undo.');ui.undoSig='';ui.dirty=true;return}
  const cur={};for(const r of G.routes)cur[r.name]=r.stops.length;
  restoreNet(d);ui.undoSig='';
  let re=null;for(const r of G.routes)if(cur[r.name]!==undefined&&r.stops.length<cur[r.name])re=r;
  if(re){setTool('route');ui.drawing={routeId:re.id};ui.sel={type:'route',id:re.id};toast('Undone. You are still on '+re.name+': tap the next stop.')}
  else toast(Object.keys(cur).length>G.routes.length?'Undone: a route was removed.':'Undone: your last change was reverted.');

/* ================= growth & save ================= */
function growCity(){
  const L=G.L,rows=L.map.length,cols=L.map[0].length,cand=[];
  const at=(c,r)=>(r>=0&&r<rows&&c>=0&&c<cols)?L.map[r][c]:'x';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(at(c,r)!=='.')continue;
    let nh=0,nb=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const t=at(c+dc,r+dr);if(t==='H')nh++;if(t==='B')nb++}
    if(nh+nb>0)cand.push({c,r,nh,nb});
  }
  if(!cand.length)return null;
  const picks=[],n=Math.min(2,cand.length);
  for(let k=0;k<n;k++){const i=Math.floor(rnd()*cand.length),p=cand.splice(i,1)[0];picks.push(p)}
  const grid=L.map.map(s=>s.split('')),names=[];
  for(const p of picks){const letter=(p.nb>p.nh&&rnd()<.6)||rnd()<.18?'B':'H';grid[p.r][p.c]=letter;names.push((letter==='H'?'homes':'offices')+' near '+HN[p.r]+' & '+ord(p.c+1))}
  L.map=grid.map(a=>a.join(''));
  G.city=buildCity(L);
  if(T.ok){build3D(G.city);resetDyn()}
  for(const r of G.routes)recalcRoute(r);
  netChanged();
  return names.join(' and ');
}

    stops:[...G.stops.values()].map(s=>({id:s.id,acc:!!s.access,bike:!!s.bike})),
    routes:G.routes.map(r=>({via:JSON.parse(JSON.stringify(r.via||{})),name:r.name,color:r.color,stops:r.stops.slice(),express:r.express,ep:r.expressPaid,loop:r.loop,lane:r.lane,sched:r.sched,night:!!r.night,model:r.model,spacing:!!r.spacing,buses:r.buses.length})),

const cam={x:0,y:0,zoom:1,minZ:.3,maxZ:3.2,yaw:0,pitch:.92,fov:36};

  const r=cv.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,(PROF.gfx==='light'||PROF.gfx==='saver')?1:PROF.gfx==='ultra'?2.5:(window.matchMedia&&matchMedia('(pointer:coarse)').matches)?1.5:2);
