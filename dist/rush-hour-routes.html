  if(G.city)fitCam(false);
}
function updateCamera(){
  if(!T.ok)return;
  const dist=(H/2)/(Math.tan(cam.fov*Math.PI/360)*cam.zoom),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  T.camera.position.set(cam.x+Math.sin(cam.yaw)*cp*dist,sp*dist,cam.y+Math.cos(cam.yaw)*cp*dist);
  T.camera.near=Math.max(5,dist*.05);T.camera.far=dist*8;T.camera.updateProjectionMatrix();
  T.camera.lookAt(cam.x,0,cam.y);T.camera.updateMatrixWorld(true);cam.dist=dist;
}
function toWorld(sx,sy){
  if(!T.ok)return{x:cam.x,y:cam.y};
  T.ray.setFromCamera({x:sx/W*2-1,y:-(sy/H*2-1)},T.camera);
  const p=T.ray.ray.intersectPlane(T.plane,T.v);
  return p?{x:p.x,y:p.z}:null;
}
function fitCam(force){
  if(!G.city)return;
  const topH=($('#row1').getBoundingClientRect().bottom||100)+10,botH=Math.max(60,H-($('#toolbar').getBoundingClientRect().top||H-90))+10;
  const availH=Math.max(120,H-topH-botH),z=Math.min(W/G.city.w,availH/(G.city.h*Math.sin(.92)))*1.04;
  cam.minZ=z*.7;cam.maxZ=3.2;
  cam.zoom=z;cam.yaw=0;cam.pitch=.92;cam.x=G.city.w/2;cam.y=G.city.h/2;updateCamera();
  const g=toWorld(W/2,(topH+(H-botH))/2);

  updateCamera();
}
function zoomAt(sx,sy,f){
  const a=toWorld(sx,sy);

  const b=toWorld(sx,sy);

  clampCam();updateCamera();
}
function clampCam(){if(!G.city)return;cam.x=clamp(cam.x,0,G.city.w);cam.y=clamp(cam.y,0,G.city.h)}
function panBy(x0,y0,x1,y1){
  const a=toWorld(x0,y0),b=toWorld(x1,y1);

const pointers=new Map();let gesture=null,multi=false;

  ensureAudio();

  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const r=cv.getBoundingClientRect();
  pointers.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top,sx:e.clientX-r.left,sy:e.clientY-r.top,t:performance.now(),moved:false,rot:e.button===2||e.shiftKey||e.ctrlKey});
  if(pointers.size>=2){multi=true;startGesture()}

function startGesture(){
  const a=[...pointers.values()];

cv.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,p=pointers.get(e.pointerId);
  if(!p){if(e.pointerType==='mouse'){ui.hover=(ui.tool!=='select')?nearestNode(x,y,55):null}return}
  const px=p.x,py=p.y;p.x=x;p.y=y;
  if(Math.hypot(x-p.sx,y-p.sy)>8)p.moved=true;
  if(pointers.size===1&&p.moved){
    if(p.rot){cam.yaw-=(x-px)*.006;cam.pitch=clamp(cam.pitch+(y-py)*.004,.55,1.3);updateCamera()}
    else{panBy(px,py,x,y);if(ui.follow){ui.follow=null;ui.dirty=true}}
  }else if(pointers.size>=2&&gesture){
    const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2,ang=Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x);

    let da=ang-gesture.ang;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;

function endPointer(e,cancel){
  const p=pointers.get(e.pointerId);if(!p)return;
  pointers.delete(e.pointerId);
  const wasMulti=multi;
  if(pointers.size===0){multi=false;gesture=null;cv.style.cursor=ui.tool==='select'?'grab':'crosshair'}
  else if(pointers.size===1)gesture=null;
  if(!cancel&&!wasMulti&&!p.moved&&!p.rot&&performance.now()-p.t<700)onTap(p.x,p.y);

cv.addEventListener('pointerup',e=>endPointer(e,false));
cv.addEventListener('pointercancel',e=>endPointer(e,true));
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)))},{passive:false});

function nearestNode(sx,sy,maxScreen){
  if(!G.city)return null;
  const w=toWorld(sx,sy);if(!w)return null;
  let best=null,bd=Infinity;
  const lim=Math.min(55,maxScreen/cam.zoom);
  for(const n of G.city.nodes){if(!n.alive)continue;const d=Math.hypot(n.x-w.x,n.y-w.y);if(d<bd){bd=d;best=n}}
  return best&&bd<=Math.max(lim,34)?best:null;
}
function onTap(sx,sy){
  if(G.modal||ui.tour||!G.city)return;
  if(ui.shape){const n=nearestNode(sx,sy,60);if(n)shapeTap(n);return}
  if(ui.moving){const n=nearestNode(sx,sy,60);if(n){pushUndo();moveStop(ui.moving,n.id)}return}
  const tool=ui.tool;
  if(tool==='select'){
    const w=toWorld(sx,sy);if(!w)return;
    for(const b of G.buses){if(Math.hypot(b.x-w.x,b.y-w.y)<Math.max(22,24/cam.zoom)){ui.follow=b.id;cam.zoom=Math.max(cam.zoom,2);ui.dirty=true;return}}
    let best=null,bd=Math.max(30,30/cam.zoom);
    for(const st of G.stops.values()){const d=Math.hypot(st.x-w.x,st.y-w.y);if(d<bd){bd=d;best=st}}
    ui.sel=best?{type:'stop',id:best.id}:null;if(best)ui.sheet=false;ui.dirty=true;return;
  }
  const n=nearestNode(sx,sy,60);if(!n){if(tool==='stop'||tool==='route')toast('Tap right on a road junction to place a stop.',1800);return}
  if(tool==='stop'||tool==='route')pushUndo();
  if(tool==='stop'){
    if(G.stops.has(n.id)){ui.sel={type:'stop',id:n.id};ui.sheet=false;ui.dirty=true}
    else{if(!addStop(n.id))return;ui.sel={type:'stop',id:n.id};fx.ring(n.x,n.y,'#2a7de1',34);snd('pop');netChanged()}
    return;
  }
  if(tool==='route')routeTap(n);
}
function routeTap(n){
  const L=G.L,d=ui.drawing,st=G.stops.get(n.id);
  const owner=st?routesAt(n.id):[];
  if(!d){
    if(!st){if(!addStop(n.id))return;ui.drawing={routeId:null,first:n.id};fx.ring(n.x,n.y,'#2a7de1',34);snd('pop');ui.dirty=true;return}
    const enders=owner.filter(r=>r.stops[r.stops.length-1]===n.id&&!r.loop);
    if(enders.length&&!ui.newRt){const er=(ui.sel&&ui.sel.type==='route'&&enders.find(r=>r.id===ui.sel.id))||enders.slice().sort((a,b)=>b.id-a.id)[0];ui.drawing={routeId:er.id};ui.sel={type:'route',id:er.id};toast('Extending '+er.name+'. Tap the next stop.');ui.dirty=true;return}
    ui.newRt=false;
    if(owner.length&&!L.transfer){toast('That stop is on '+owner[0].name+'. Transfers unlock at Metro Heights (level 3 of the campaign).');return}
    ui.drawing={routeId:null,first:n.id};ui.dirty=true;return;
  }
  if(d.routeId===null){
    if(n.id===d.first){ui.drawing=null;toast('Route cancelled.');ui.dirty=true;return}
    if(owner.length&&!L.transfer){toast('That stop is on '+owner[0].name+'. Transfers unlock at Metro Heights (level 3 of the campaign).');return}
    if(G.routes.length>=8){toast('Maximum of 8 routes.');return}
    if(!st&&!addStop(n.id))return;
    const r=newRoute([d.first,n.id]);
    const ok=addBus(r);if(!ok)toast(r.name+' has no bus yet. Add one in the Buses panel when you have cash.');
    ui.drawing={routeId:r.id};ui.sel={type:'route',id:r.id};toast(r.name+' is running. Keep tapping stops to extend it.');fx.ring(n.x,n.y,r.color,34);snd('pop');netChanged();return;
  }
  const r=G.routes.find(x=>x.id===d.routeId);
  if(!r){ui.drawing=null;ui.dirty=true;return}
  if(st&&r.stops.includes(n.id)){
    if(r.stops[r.stops.length-1]===n.id){finishDrawing();return}
    toast('That stop is already on '+r.name+'.');return;
  }
  if(st&&owner.length&&!L.transfer){toast('That stop is on '+owner[0].name+'. Transfers unlock at Metro Heights (level 3 of the campaign).');return}
  if(!st&&!addStop(n.id))return;
  r.stops.push(n.id);recalcRoute(r);fx.ring(n.x,n.y,r.color,34);snd('pop');netChanged();
}
function finishDrawing(){const id=ui.drawing&&ui.drawing.routeId;ui.drawing=null;ui.newRt=false;setTool('select');if(id){ui.sheet=true;toast('Use + and − to add or remove buses.')}ui.dirty=true}
function undoDraw(){
  const d=ui.drawing;if(!d)return;
  if(d.routeId===null){ui.drawing=null;ui.dirty=true;return}
  const r=G.routes.find(x=>x.id===d.routeId);if(!r){ui.drawing=null;return}
  const last=r.stops.pop();
  if(r.stops.length<2){const first=r.stops[0];r.stops.push(last);deleteRoute(r);ui.drawing={routeId:null,first};ui.dirty=true;return}
  recalcRoute(r);netChanged();
}

let last=performance.now(),uiT=0;
function frame(now){
  const rdt=Math.min(.1,(now-last)/1000);last=now;
  if(G.city){
    if(!G.paused&&!G.modal&&!G.over){
      let dt=rdt*G.speed;
      while(dt>0&&!G.modal&&!G.over){const s=Math.min(.05,dt);stepAll(s);dt-=s}
    }
    uiT+=rdt;
    if(ui.dirty)refreshUI();
    if(uiT>.25){uiT=0;ui.vibrate=true;coachTick();hud();updateStopCard(false);liveInfo();applyHint()}
    if(ui.follow){const fb=G.buses.find(x=>x.id===ui.follow);if(!fb){ui.follow=null;ui.dirty=true}else{const k=Math.min(1,rdt*5);cam.x+=(fb.x-cam.x)*k;cam.y+=(fb.y-cam.y)*k;clampCam()}}
    if(ui.photo)cam.yaw+=rdt*.1;
    if(uiT===0)audioUpdate();
    if(!(PROF.gfx==='saver'&&now-(T.lastR||0)<31)){T.lastR=now;render3D(now,(!G.paused&&!G.modal&&!G.over)?rdt*G.speed:0,rdt)}
  }
  requestAnimationFrame(frame);
}
